<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>색상 매칭 (mini32)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .color-target {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            margin: 20px auto;
            border: 4px solid #fff;
        }

        .color-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 30px auto;
            max-width: 400px;
        }

        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            border: 3px solid #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.1s;
            color: #fff;
        }

        .color-btn:active {
            transform: scale(0.92);
        }

        .color-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🎨 색상 매칭</h1>
                    <p>30초 동안 목표 색상과 같은 버튼을 클릭하세요!</p>
                </header>

                <div class="timer" id="timer">30.0</div>
                <p style="text-align: center; color: var(--muted); margin: 10px 0;">목표 색상:</p>
                <div class="color-target" id="colorTarget"></div>

                <div class="color-buttons" id="colorButtons"></div>

                <div class="stats-bar mb-4">
                    <div class="stat-item">점수: <span id="score">0</span></div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>

    <script>
        const PAGE_ID = "mini32";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const colorTarget = document.getElementById('colorTarget');
        const colorButtons = document.getElementById('colorButtons');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const btnStart = document.getElementById('btnStart');

        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B88B'];
        let score = 0;
        let time = 30.0;
        let running = false;
        let timer = null;
        let targetColor = '';

        function generateColorButtons() {
            colorButtons.innerHTML = '';
            const shuffled = colors.sort(() => Math.random() - 0.5).slice(0, 3);
            targetColor = shuffled[Math.floor(Math.random() * shuffled.length)];
            colorTarget.style.backgroundColor = targetColor;

            shuffled.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.style.backgroundColor = color;
                btn.style.borderColor = '#fff';
                btn.disabled = !running;
                btn.addEventListener('click', () => {
                    if (running && color === targetColor) {
                        score++;
                        scoreEl.textContent = score;
                        generateColorButtons();
                    }
                });
                btn.addEventListener('touchstart', (e) => {
                    if (running && color === targetColor) {
                        e.preventDefault();
                        score++;
                        scoreEl.textContent = score;
                        generateColorButtons();
                    }
                }, { passive: false });
                colorButtons.appendChild(btn);
            });
        }

        function tick() {
            time -= 0.1;
            timerEl.textContent = time.toFixed(1);
            if (time <= 0) {
                time = 0;
                gameOver();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            Array.from(colorButtons.querySelectorAll('button')).forEach(btn => btn.disabled = true);
            btnStart.disabled = false;
            btnStart.textContent = '다시 시작';

            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    scoreEl.textContent = '0';
                    score = 0;
                    time = 30.0;
                    timerEl.textContent = time.toFixed(1);
                });
            }
        }

        btnStart.addEventListener('click', () => {
            if (running) return;
            running = true;
            score = 0;
            time = 30.0;
            scoreEl.textContent = '0';
            timerEl.textContent = '30.0';
            btnStart.disabled = true;
            generateColorButtons();
            Array.from(colorButtons.querySelectorAll('button')).forEach(btn => btn.disabled = false);

            timer = setInterval(tick, 100);
        });

        generateColorButtons();
    </script>
</body>

</html>
