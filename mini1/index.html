<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반응속도 테스트</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>⚡ 반응속도 테스트</h1>
          <p>화면이 초록색으로 변하면 최대한 빨리 클릭하세요!</p>
        </header>

        <div id="gameArea" style="
          width: 100%; height: 300px; 
          background: var(--panel); 
          border-radius: 12px; 
          display: flex; align-items: center; justify-content: center; 
          font-size: 1.5rem; font-weight: bold; 
          cursor: pointer;
          user-select: none;
          transition: background 0.1s;
        ">
          클릭하여 시작
        </div>

        <div id="status" class="mt-4 stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">대기 중</span>
          </div>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">총 방문수</span>
            <span class="stat-value" id="visitsView">-</span>
          </div>
        </div>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (빠른 순)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="../shared/ranking.js"></script>

  <script>
    const PAGE_ID = "mini1";
    const gameArea = document.getElementById('gameArea');
    const statusText = document.getElementById('statusText');
    const visitsView = document.getElementById('visitsView');
    const rankList = document.getElementById('rankList');

    let state = "waiting"; // waiting, ready, now
    let timeoutId = null;
    let startTime = 0;

    // 1. Visit Count
    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, (val) => {
        visitsView.textContent = val ?? "-";
      });

      // 2. Top Scores
      GameStats.listenTopScores(PAGE_ID, 5, (arr) => {
        rankList.innerHTML = "";
        if (!arr || arr.length === 0) {
          rankList.innerHTML = "<li>기록이 없습니다.</li>";
          return;
        }
        arr.forEach((item, idx) => {
          const li = document.createElement('li');
          li.textContent = `${idx + 1}위: ${item.name} - ${item.score}ms`;
          rankList.appendChild(li);
        });
      });
    }

    function startGame() {
      state = "ready";
      gameArea.style.background = "var(--bad)"; // Red
      gameArea.textContent = "초록색이 되면 클릭하세요!";
      statusText.textContent = "기다리세요...";

      const randomTime = Math.floor(Math.random() * 2000) + 2000; // 2~4s

      timeoutId = setTimeout(() => {
        state = "now";
        gameArea.style.background = "var(--good)"; // Green
        gameArea.textContent = "지금 클릭!!!";
        statusText.textContent = "클릭하세요!";
        startTime = Date.now();
      }, randomTime);
    }

    function endGame(ms) {
      state = "waiting";
      gameArea.style.background = "var(--panel)"; // Reset
      gameArea.textContent = `${ms}ms! 클릭하여 다시 시작`;
      statusText.textContent = `기록: ${ms}ms`;

      // Save Score
      const nick = localStorage.getItem('nickname') || prompt("기록 등록을 위해 닉네임을 입력하세요:") || "익명";
      localStorage.setItem('nickname', nick);
      if (window.GameStats) GameStats.saveScore(PAGE_ID, nick, ms);
    }

    gameArea.addEventListener('mousedown', () => {
      if (state === "waiting") {
        startGame();
      } else if (state === "ready") {
        clearTimeout(timeoutId);
        state = "waiting";
        gameArea.style.background = "var(--panel)";
        gameArea.textContent = "너무 빨랐습니다! 다시 클릭";
        statusText.textContent = "부정 출발!";
      } else if (state === "now") {
        const endTime = Date.now();
        endGame(endTime - startTime);
      }
    });
  </script>
</body>

</html>
