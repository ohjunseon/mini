<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>반응속도 테스트 게임</title>
<style>
  body {
    margin: 0; 
    font-family: Arial, sans-serif; 
    text-align: center; 
    background-color: #f0f0f0;
  }
  h1 { margin-top: 20px; }
  #gameArea {
    margin: 50px auto; 
    width: 300px; 
    height: 300px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 24px; 
    border: 3px solid #333; 
    border-radius: 10px; 
    background-color: #fff;
    cursor: pointer;
  }
  #status {
    margin-top: 20px;
    font-size: 20px;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
  }
</style>
</head>
<body>

<h1>반응속도 테스트</h1>
<div id="gameArea">클릭 시작!</div>
<div id="status">상태: 대기 중</div>
<button onclick="startGame()">게임 시작</button>

<!-- 구글 광고 삽입 -->
<ins class="adsbygoogle"
     style="display:block; margin:20px auto;"
     data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
<script>
(adsbygoogle = window.adsbygoogle || []).push({});


</script>

<script>
const gameArea = document.getElementById('gameArea');
const statusText = document.getElementById('status');

let gameActive = false;
let startTime;
let endTime;
let timeoutId;

function startGame() {
  document.getElementById('status').textContent = '준비 중... 클릭을 기다립니다.';
  gameActive = false;
  gameArea.innerHTML = '클릭 시작!';
  gameArea.style.backgroundColor = '';

  // 일정 시간 후에 색깔 변경
  const delay = Math.random() * 3000 + 2000; // 2~5초 랜덤
  clearTimeout(timeoutId);
  timeoutId = setTimeout(()=> {
    changeColor();
  }, delay);
}

function changeColor() {
  const colors = ['red', 'green', 'blue', 'orange', 'purple'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  gameArea.style.backgroundColor = color;
  gameArea.innerHTML = '클릭하세요!';
  startTime = new Date();
  gameActive = true;
  statusText.textContent = '지금 누르세요!';
}

// 클릭 이벤트
gameArea.addEventListener('click', ()=> {
  if (!gameActive) {
    // 아직 색깔이 안 바뀐 상태
    clearTimeout(timeoutId);
    statusText.textContent = '너무 빨랐어요! 다시 시작하세요.';
  } else {
    endTime = new Date();
    const reactionTime = endTime - startTime; // ms 단위
    statusText.textContent = `반응속도: ${reactionTime} ms`;
    gameActive = false;
  }
});
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8706169372638751"
     crossorigin="anonymous"></script>
</body>
</html>
