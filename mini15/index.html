<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>사이먼 게임 (mini15)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .simon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 300px;
            margin: 20px auto;
            position: relative;
        }

        .simon-btn {
            aspect-ratio: 1/1;
            border-radius: 20px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.1s, transform 0.1s;
            border: none;
        }

        .simon-btn:active {
            transform: scale(0.95);
        }

        .simon-btn.lit {
            opacity: 1;
            box-shadow: 0 0 20px currentColor;
        }

        .c-0 {
            background-color: #ef4444;
            color: #ef4444;
        }

        /* Red */
        .c-1 {
            background-color: #3b82f6;
            color: #3b82f6;
        }

        /* Blue */
        .c-2 {
            background-color: #22c55e;
            color: #22c55e;
        }

        /* Green */
        .c-3 {
            background-color: #eab308;
            color: #eab308;
        }

        /* Yellow */

        .center-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel);
            border: 4px solid var(--panel-border);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🧠 사이먼 게임</h1>
                    <p>빛나는 순서를 기억하고 따라하세요!</p>
                </header>

                <div class="simon-grid">
                    <button class="simon-btn c-0" id="b0"></button>
                    <button class="simon-btn c-1" id="b1"></button>
                    <button class="simon-btn c-2" id="b2"></button>
                    <button class="simon-btn c-3" id="b3"></button>
                    <div class="center-overlay" id="roundDisp">Start</div>
                </div>

                <div id="msg" class="mt-4" style="height: 24px;">시작 버튼을 누르세요</div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹 (최고 라운드)</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../shared/firebase.js"></script>

    <script>
        const PAGE_ID = "mini15";
        if (window.GameStats) {
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                const rl = document.getElementById('rankList');
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score}라운드)</li>`).join('');
            });
        }

        const btns = [
            document.getElementById('b0'),
            document.getElementById('b1'),
            document.getElementById('b2'),
            document.getElementById('b3')
        ];
        const rLabel = document.getElementById('roundDisp');
        const msg = document.getElementById('msg');
        const startBtn = document.getElementById('btnStart');

        let sequence = [];
        let userSeq = [];
        let round = 0;
        let playing = false;
        let inputLocked = true;

        // Sounds (Simple oscillators)
        const freqs = [300, 400, 500, 600];
        const ac = new (window.AudioContext || window.webkitAudioContext)();

        function beep(idx) {
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.frequency.value = freqs[idx];
            osc.connect(g).connect(ac.destination);
            osc.start();
            g.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + 0.3);
            osc.stop(ac.currentTime + 0.3);
        }

        function flash(idx) {
            const b = btns[idx];
            b.classList.add('lit');
            beep(idx);
            setTimeout(() => b.classList.remove('lit'), 300);
        }

        async function playSequence() {
            inputLocked = true;
            msg.textContent = "보세요!";

            await new Promise(r => setTimeout(r, 800));

            for (let idx of sequence) {
                flash(idx);
                await new Promise(r => setTimeout(r, 600));
            }

            inputLocked = false;
            msg.textContent = "따라하세요!";
        }

        function nextRound() {
            round++;
            rLabel.textContent = round;
            userSeq = [];
            sequence.push(Math.floor(Math.random() * 4));
            playSequence();
        }

        function gameOver() {
            playing = false;
            alert(`게임 오버! 도달 라운드: ${round}`);
            const nick = localStorage.getItem('nickname') || prompt("기록 저장을 위한 닉네임?") || "익명";
            localStorage.setItem('nickname', nick);
            if (window.GameStats) GameStats.saveScore(PAGE_ID, nick, round);

            startBtn.style.display = 'inline-block';
            startBtn.textContent = "다시 하기";
            msg.textContent = "게임 오버";
        }

        function handleInput(idx) {
            if (!playing || inputLocked) return;

            flash(idx);
            userSeq.push(idx);

            if (userSeq[userSeq.length - 1] !== sequence[userSeq.length - 1]) {
                gameOver();
                return;
            }

            if (userSeq.length === sequence.length) {
                inputLocked = true;
                setTimeout(nextRound, 1000);
            }
        }

        btns.forEach((b, i) => b.onclick = () => handleInput(i));

        startBtn.onclick = () => {
            if (ac.state === 'suspended') ac.resume();
            playing = true;
            round = 0;
            sequence = [];
            startBtn.style.display = 'none';
            nextRound();
        };

    </script>
</body>

</html>
