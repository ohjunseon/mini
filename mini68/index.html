<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그리드 슬라이드</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 20px;
      background: var(--panel);
      border-radius: 12px;
      margin: 20px auto;
      max-width: 250px;
    }

    .puzzle-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid var(--panel-border);
      transition: all 0.1s;
    }

    .puzzle-cell.number {
      background: var(--accent);
      color: var(--text);
    }

    .puzzle-cell.empty {
      background: var(--panel-border);
      color: transparent;
    }

    .puzzle-cell:hover:not(.empty) {
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🔢 그리드 슬라이드</h1>
          <p>숫자를 올바른 순서로 정렬하세요!</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">게임 중...</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">시간</span>
            <span class="stat-value" id="timeValue">0초</span>
          </div>
        </div>

        <div class="puzzle-grid" id="puzzleGrid"></div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn btn-primary" id="restartBtn">🔄 새로운 게임</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (높은 점수)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini68";
    const puzzleGridEl = document.getElementById('puzzleGrid');
    const statusTextEl = document.getElementById('statusText');
    const timeValueEl = document.getElementById('timeValue');
    const scoreValueEl = document.getElementById('scoreValue');
    const restartBtn = document.getElementById('restartBtn');
    const rankList = document.getElementById('rankList');

    let puzzle = [1, 2, 3, 0]; // 0 = empty
    let startTime = 0;
    let gameActive = false;

    function initializeGame() {
      puzzle = [1, 2, 3, 0];
      // Shuffle
      for (let i = 0; i < 30; i++) {
        const emptyIdx = puzzle.indexOf(0);
        const directions = [];
        if (emptyIdx > 1) directions.push(emptyIdx - 2);
        if (emptyIdx < 2) directions.push(emptyIdx + 2);
        if (emptyIdx % 2 === 1) directions.push(emptyIdx - 1);
        if (emptyIdx % 2 === 0) directions.push(emptyIdx + 1);

        const swapIdx = directions[Math.floor(Math.random() * directions.length)];
        [puzzle[emptyIdx], puzzle[swapIdx]] = [puzzle[swapIdx], puzzle[emptyIdx]];
      }

      startTime = Date.now();
      gameActive = true;
      statusTextEl.textContent = '게임 중...';
      draw();
      updateTime();
    }

    function draw() {
      puzzleGridEl.innerHTML = '';
      puzzle.forEach((num, idx) => {
        const cell = document.createElement('div');
        cell.className = num === 0 ? 'puzzle-cell empty' : 'puzzle-cell number';
        cell.textContent = num || '';
        cell.addEventListener('click', () => moveNumber(idx));
        puzzleGridEl.appendChild(cell);
      });
    }

    function moveNumber(idx) {
      if (!gameActive) return;

      const emptyIdx = puzzle.indexOf(0);
      const directions = [];
      if (emptyIdx > 1) directions.push(emptyIdx - 2);
      if (emptyIdx < 2) directions.push(emptyIdx + 2);
      if (emptyIdx % 2 === 1) directions.push(emptyIdx - 1);
      if (emptyIdx % 2 === 0) directions.push(emptyIdx + 1);

      if (directions.includes(idx)) {
        [puzzle[idx], puzzle[emptyIdx]] = [puzzle[emptyIdx], puzzle[idx]];
        draw();
        checkWin();
      }
    }

    function checkWin() {
      if (JSON.stringify(puzzle) === JSON.stringify([1, 2, 3, 0])) {
        gameActive = false;
        statusTextEl.textContent = '완료!';
        const time = Math.floor((Date.now() - startTime) / 1000);
        const score = Math.max(100 - time * 2, 10);
        scoreValueEl.textContent = Math.floor(score);
        saveScore(Math.floor(score));
      }
    }

    function updateTime() {
      if (gameActive) {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        timeValueEl.textContent = elapsed + '초';
        setTimeout(updateTime, 100);
      }
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. ${s.score}점</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    restartBtn.addEventListener('click', initializeGame);

    initializeGame();
    loadTopScores();
  </script>
</body>

</html>
