<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>펀칭백</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 20px auto;
      background: linear-gradient(180deg, #3a2a4a, #2a1a3a);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      cursor: pointer;
      max-width: 100%;
    }
    .canvas-wrapper {
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameStatus {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin: 15px 0;
      padding: 12px;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>👊 펀칭백</h1>
          <p>떨어지는 펀칭백을 정확한 타이밍에 펀치하세요!</p>
        </header>

        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="320" height="480"></canvas>
        </div>

        <div id="gameStatus">준비 중...</div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">남은 시간</span>
            <span class="stat-value" id="timerValue">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">펀치 횟수</span>
            <span class="stat-value" id="punchValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini93";
    const GAME_DURATION = 20;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameStatus = document.getElementById('gameStatus');
    const startBtn = document.getElementById('startBtn');
    const timerValue = document.getElementById('timerValue');
    const punchValue = document.getElementById('punchValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let animationId = null;
    let totalScore = 0;
    let punchCount = 0;

    let bagX = 160;
    let bagY = 100;
    let bagVY = 0;
    let bagState = 'idle'; // idle, falling, punched
    let punches = [];

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function startGame() {
      gameActive = true;
      timeLeft = GAME_DURATION;
      totalScore = 0;
      punchCount = 0;
      startBtn.disabled = true;
      bagState = 'idle';
      bagY = 100;
      bagVY = 0;
      punches = [];

      timerInterval = setInterval(() => {
        timeLeft--;
        timerValue.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      gameLoop();
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      if (animationId) cancelAnimationFrame(animationId);
      startBtn.disabled = false;

      gameStatus.textContent = `게임 종료! 최종 점수: ${totalScore}`;

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, totalScore);
        }

        setTimeout(() => {
          totalScore = 0;
          punchCount = 0;
          timeLeft = GAME_DURATION;
          timerValue.textContent = GAME_DURATION;
          punchValue.textContent = '0';
          scoreValue.textContent = '0';
          gameStatus.textContent = '준비 중...';
        }, 1000);
      }, 1000);
    }

    function gameLoop() {
      ctx.fillStyle = '#3a2a4a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw background
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }

      // Draw punching bag
      if (bagState === 'falling') {
        bagVY += 0.3;
        bagY += bagVY;

        if (bagY > canvas.height) {
          bagState = 'idle';
          bagY = 100;
          bagVY = 0;
        }
      } else if (bagState === 'idle') {
        // Randomize fall timing
        if (Math.random() < 0.02) {
          bagState = 'falling';
          bagVY = 0;
        }
      }

      // Draw bag
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(bagX, bagY, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ff5555';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bagX, bagY, 20, 0, Math.PI * 2);
      ctx.stroke();

      // Draw punches
      for (let i = 0; i < punches.length; i++) {
        const punch = punches[i];
        punch.age++;
        const opacity = 1 - punch.age / 10;
        if (opacity > 0) {
          ctx.strokeStyle = `rgba(255, 107, 107, ${opacity})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(punch.x, punch.y, punch.radius + punch.age, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          punches.splice(i, 1);
          i--;
        }
      }

      // Draw glove
      const gloveY = canvas.height - 40;
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(140, gloveY, 40, 40);
      ctx.strokeStyle = '#ffb300';
      ctx.lineWidth = 2;
      ctx.strokeRect(140, gloveY, 40, 40);

      scoreValue.textContent = totalScore;
      punchValue.textContent = punchCount;
      animationId = requestAnimationFrame(gameLoop);
    }

    function punch() {
      if (!gameActive) return;

      punchCount++;
      punches.push({
        x: bagX,
        y: bagY,
        radius: 5,
        age: 0
      });

      if (bagState === 'falling' && Math.abs(bagY - (canvas.height - 40)) < 100) {
        totalScore += 10;
        bagState = 'idle';
        bagY = 100;
        bagVY = 0;
      } else if (bagState === 'idle') {
        totalScore += 5;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        punch();
      }
    });

    canvas.addEventListener('click', punch);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      punch();
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
