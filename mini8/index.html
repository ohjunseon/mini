<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>테트리스 (mini8)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        canvas {
            background: #000;
            border: 2px solid var(--accent);
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🧱 테트리스</h1>
                    <p>블록을 쌓아 줄을 없애세요. (방향키: 이동/회전)</p>
                </header>

                <canvas id="tetris" width="240" height="400"></canvas>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">시작</button>
                </div>

                <div class="stats-bar mt-4">
                    <div class="stat-item">점수: <span id="score">0</span></div>
                </div>

                <div class="controls mt-4" style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn secondary" id="btnLeft">◀</button>
                    <button class="btn secondary" id="btnRotate">↻</button>
                    <button class="btn secondary" id="btnRight">▶</button>
                    <button class="btn secondary" id="btnDown">▼</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>로딩 중...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../shared/firebase.js"></script>

    <script>
        const PAGE_ID = "mini8";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const cvs = document.getElementById('tetris');
        const ctx = cvs.getContext('2d');
        const scoreEl = document.getElementById('score');

        ctx.scale(20, 20);

        const arena = createMatrix(12, 20);
        const player = { pos: { x: 0, y: 0 }, matrix: null, score: 0 };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let running = false;
        let requestId = null;

        function createPiece(type) {
            if (type === 'I') { return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]]; }
            else if (type === 'L') { return [[0, 2, 0], [0, 2, 0], [0, 2, 2]]; }
            else if (type === 'J') { return [[0, 3, 0], [0, 3, 0], [3, 3, 0]]; }
            else if (type === 'O') { return [[4, 4], [4, 4]]; }
            else if (type === 'Z') { return [[5, 5, 0], [0, 5, 5], [0, 0, 0]]; }
            else if (type === 'S') { return [[0, 6, 6], [6, 6, 0], [0, 0, 0]]; }
            else if (type === 'T') { return [[0, 7, 0], [7, 7, 7], [0, 0, 0]]; }
        }

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, cvs.width, cvs.height);
            drawMatrix(arena, { x: 0, y: 0 });
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                gameOver();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function updateScore() {
            scoreEl.innerText = player.score;
        }

        function gameOver() {
            running = false;
            cancelAnimationFrame(requestId);
            alert(`게임 오버! 점수: ${player.score}`);
            if (player.score > 0) {
                const nick = localStorage.getItem('nickname') || prompt('닉네임?') || '익명';
                localStorage.setItem('nickname', nick);
                if (window.GameStats) GameStats.saveScore(PAGE_ID, nick, player.score);
            }
            document.getElementById('btnStart').style.display = 'inline-block';
            document.getElementById('btnStart').innerText = "다시 시작";
            // Clean arena
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }

        function update(time = 0) {
            if (!running) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            draw();
            requestId = requestAnimationFrame(update);
        }

        document.addEventListener('keydown', event => {
            if (!running) return;
            if (event.key === "ArrowLeft") playerMove(-1);
            else if (event.key === "ArrowRight") playerMove(1);
            else if (event.key === "ArrowDown") playerDrop();
            else if (event.key === "ArrowUp") playerRotate(1);
        });

        // Mobile
        document.getElementById('btnLeft').onclick = () => playerMove(-1);
        document.getElementById('btnRight').onclick = () => playerMove(1);
        document.getElementById('btnDown').onclick = () => playerDrop();
        document.getElementById('btnRotate').onclick = () => playerRotate(1);

        document.getElementById('btnStart').onclick = () => {
            if (running) return;
            running = true;
            playerReset();
            updateScore();
            update();
            document.getElementById('btnStart').style.display = 'none';
        }
    </script>
</body>

</html>
