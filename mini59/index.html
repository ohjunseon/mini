<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스키 내려오기</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 20px auto;
      background: linear-gradient(180deg, #ffffff, #e0f2f7);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      max-width: 100%;
    }
    .canvas-wrapper {
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameStatus {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin: 15px 0;
      padding: 12px;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
  <meta name="description" content="장애물 피하기 스키 게임 - 미니게임">
  <meta name="keywords" content="스포츠, 미니게임, 게임">
  <meta name="theme-color" content="#00e5ff">
  <meta property="og:title" content="⛷️ 스키 내려오기">
  <meta property="og:description" content="장애물 피하기 스키 게임">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/mini59/cover.png">
  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="⛷️ 스키 내려오기">
  <meta property="twitter:description" content="장애물 피하기 스키 게임">
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "⛷️ 스키 내려오기",
  "description": "장애물 피하기 스키 게임",
  "url": "https://mini.npig82.workers.dev/mini59/",
  "image": "https://mini.npig82.workers.dev/mini59/cover.png",
  "genre": "스포츠",
  "applicationCategory": "Game",
  "operatingSystem": "Any (Web Browser)",
  "inLanguage": "ko",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "KRW"
  }
}
    </script>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>⛷️ 스키 내려오기</h1>
          <p>A/D키 또는 화면 좌·우 터치로 좌우 회피하세요!</p>
        </header>

        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="320" height="480"></canvas>
        </div>

        <div id="gameStatus">준비 중...</div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">남은 시간</span>
            <span class="stat-value" id="timerValue">25</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">회피한 장애물</span>
            <span class="stat-value" id="obstaclesValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
    <script src="../shared/juice.js"></script>
  <script>
    const PAGE_ID = "mini59";
    const GAME_DURATION = 25;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameStatus = document.getElementById('gameStatus');
    const startBtn = document.getElementById('startBtn');
    const timerValue = document.getElementById('timerValue');
    const obstaclesValue = document.getElementById('obstaclesValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let animationId = null;
    let totalScore = 0;
    let obstaclesAvoided = 0;

    let playerX = 160;
    let playerY = 400;
    let obstacles = [];
    let scrollOffset = 0;
    let keys = {};

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function startGame() {
      gameActive = true;
      timeLeft = GAME_DURATION;
      totalScore = 0;
      obstaclesAvoided = 0;
      playerX = 160;
      scrollOffset = 0;
      obstacles = [];
      startBtn.disabled = true;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerValue.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      gameLoop();
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      if (animationId) cancelAnimationFrame(animationId);
      startBtn.disabled = false;

      gameStatus.textContent = `게임 종료! 최종 점수: ${totalScore}`;

      setTimeout(() => {
        if (window.GameStats) {
          GameStats.saveScore(PAGE_ID, playerName, totalScore);
        }

        setTimeout(() => {
          totalScore = 0;
          obstaclesAvoided = 0;
          timeLeft = GAME_DURATION;
          timerValue.textContent = GAME_DURATION;
          obstaclesValue.textContent = '0';
          scoreValue.textContent = '0';
          gameStatus.textContent = '준비 중...';
        }, 1000);
      }, 1000);
    }

    function gameLoop() {
      ctx.fillStyle = '#e0f2f7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw snow
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.strokeStyle = 'rgba(200, 220, 240, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }

      // Player movement
      if (keys['a'] || keys['A']) playerX = Math.max(20, playerX - 5);
      if (keys['d'] || keys['D']) playerX = Math.min(canvas.width - 20, playerX + 5);

      // Spawn obstacles
      if (Math.random() < 0.02) {
        obstacles.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -20,
          width: 40,
          height: 20,
          passed: false
        });
      }

      // Update obstacles
      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.y += 4;

        ctx.fillStyle = '#ff7f50';
        ctx.fillRect(obs.x - obs.width / 2, obs.y, obs.width, obs.height);
        ctx.strokeStyle = '#ff6b35';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x - obs.width / 2, obs.y, obs.width, obs.height);

        // Check collision
        if (checkCollision(playerX, playerY, obs)) {
          gameActive = false;
          endGame();
          return;
        }

        // Check if passed
        if (!obs.passed && obs.y > playerY) {
          obs.passed = true;
          obstaclesAvoided++;
          totalScore += 10;
        }

        // Remove if off screen
        if (obs.y > canvas.height) {
          obstacles.splice(i, 1);
          i--;
        }
      }

      // Draw player (skier)
      ctx.fillStyle = '#4a90e2';
      ctx.fillRect(playerX - 8, playerY - 15, 16, 30);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(playerX, playerY - 20, 6, 0, Math.PI * 2);
      ctx.fill();

      // Draw skis
      ctx.strokeStyle = '#4a90e2';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(playerX - 8, playerY + 15);
      ctx.lineTo(playerX - 15, playerY + 20);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(playerX + 8, playerY + 15);
      ctx.lineTo(playerX + 15, playerY + 20);
      ctx.stroke();

      scoreValue.textContent = totalScore;
      obstaclesValue.textContent = obstaclesAvoided;
      animationId = requestAnimationFrame(gameLoop);
    }

    function checkCollision(px, py, obs) {
      return px > obs.x - obs.width / 2 - 10 && px < obs.x + obs.width / 2 + 10 &&
             py > obs.y - 20 && py < obs.y + obs.height;
    }

    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // 모바일: 캔버스 왼쪽/오른쪽 절반을 누르면 그 방향으로 이동
    function touchDir(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      const left = t.clientX - rect.left < rect.width / 2;
      keys['a'] = left;
      keys['d'] = !left;
    }
    function touchClear() { keys['a'] = false; keys['d'] = false; }
    canvas.addEventListener('touchstart', touchDir, { passive: false });
    canvas.addEventListener('touchmove', touchDir, { passive: false });
    canvas.addEventListener('touchend', touchClear, { passive: true });
    canvas.addEventListener('touchcancel', touchClear, { passive: true });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
