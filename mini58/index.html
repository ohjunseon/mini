<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>보스 추격 (mini58)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        canvas {
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: linear-gradient(180deg, #1a3a5c, #0f1f3c);
            display: block;
            margin: 20px auto;
            max-width: 100%;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>👹 보스 추격</h1>
                    <p>우측의 보스를 피하며 장애물도 회피하세요! 30초 생존!</p>
                </header>

                <canvas id="gameCanvas" width="320" height="480"></canvas>

                <div class="game-info">
                    <div class="info-item">
                        <div class="info-label">시간</div>
                        <div class="info-value" id="timeValue">30.0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">생존</div>
                        <div class="info-value" id="scoreValue">0.0</div>
                    </div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>
    <script>
        const PAGE_ID = "mini58";
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const CANVAS_W = 320;
        const CANVAS_H = 480;
        const PLAYER_SIZE = 20;
        const PLAYER_X = 30;

        let gameState = "idle";
        let score = 0;
        let timeLeft = 30;
        let gameTime = 0;
        let playerY = CANVAS_H / 2;

        let bossX = CANVAS_W - 40;
        let bossY = CANVAS_H / 2;
        let bossSize = 50;

        let obstacles = [];
        let spawnRate = 0.012;
        let fallSpeed = 4;

        let keysPressed = {};

        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${Math.floor(d.score * 100)})</li>`).join('');
            });
        }

        class Obstacle {
            constructor() {
                this.x = Math.random() * (CANVAS_W - 200) + 100;
                this.y = 0;
                this.w = 35;
                this.h = 30;
            }

            update() {
                this.y += fallSpeed;
            }

            draw() {
                ctx.fillStyle = "#ff6b6b";
                ctx.fillRect(this.x - this.w / 2, this.y, this.w, this.h);
                ctx.strokeStyle = "#ff3333";
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - this.w / 2, this.y, this.w, this.h);
            }

            isOutOfBounds() {
                return this.y > CANVAS_H;
            }

            checkCollision(px, py, ps) {
                return !(px + ps / 2 < this.x - this.w / 2 || px - ps / 2 > this.x + this.w / 2 ||
                    py + ps / 2 < this.y || py - ps / 2 > this.y + this.h);
            }
        }

        function updateGame() {
            if (gameState !== "running") return;

            gameTime += 1 / 60;
            timeLeft = Math.max(0, 30 - gameTime);
            document.getElementById('timeValue').textContent = timeLeft.toFixed(1);
            document.getElementById('scoreValue').textContent = gameTime.toFixed(1);

            if (timeLeft <= 0) {
                endGame();
                return;
            }

            // 플레이어 이동
            if (keysPressed['w'] || keysPressed['W'] || keysPressed['ArrowUp']) {
                playerY -= 4;
            }
            if (keysPressed['s'] || keysPressed['S'] || keysPressed['ArrowDown']) {
                playerY += 4;
            }

            if (playerY < PLAYER_SIZE / 2) playerY = PLAYER_SIZE / 2;
            if (playerY > CANVAS_H - PLAYER_SIZE / 2) playerY = CANVAS_H - PLAYER_SIZE / 2;

            // 보스 AI - 플레이어 추격
            if (bossY < playerY - 5) {
                bossY += 2.5;
            } else if (bossY > playerY + 5) {
                bossY -= 2.5;
            }

            // 보스 충돌
            if (Math.abs(playerY - bossY) < bossSize / 2 + PLAYER_SIZE / 2 &&
                Math.abs(PLAYER_X - bossX) < bossSize / 2 + PLAYER_SIZE / 2) {
                endGame();
                return;
            }

            // 장애물 생성
            if (Math.random() < spawnRate) {
                obstacles.push(new Obstacle());
            }

            // 장애물 업데이트
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();

                if (obstacles[i].checkCollision(PLAYER_X, playerY, PLAYER_SIZE)) {
                    endGame();
                    return;
                }

                if (obstacles[i].isOutOfBounds()) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawGame() {
            // 배경
            ctx.fillStyle = "#0a1a35";
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // 플레이어
            ctx.fillStyle = "#00ff88";
            ctx.fillRect(PLAYER_X - PLAYER_SIZE / 2, playerY - PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
            ctx.strokeStyle = "#00cc66";
            ctx.lineWidth = 2;
            ctx.strokeRect(PLAYER_X - PLAYER_SIZE / 2, playerY - PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);

            // 보스 (큰 적색 괴물)
            ctx.fillStyle = "#ff4444";
            ctx.fillRect(bossX - bossSize / 2, bossY - bossSize / 2, bossSize, bossSize);
            ctx.strokeStyle = "#ff0000";
            ctx.lineWidth = 3;
            ctx.strokeRect(bossX - bossSize / 2, bossY - bossSize / 2, bossSize, bossSize);

            // 보스 눈
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(bossX - 15, bossY - 10, 8, 8);
            ctx.fillRect(bossX + 8, bossY - 10, 8, 8);

            // 장애물
            obstacles.forEach(obs => obs.draw());

            // UI
            ctx.fillStyle = "#ffffff";
            ctx.font = "11px Arial";
            ctx.textAlign = "left";
            ctx.fillText("W/S 또는 ↑↓ 이동", 10, 20);
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = "running";
            score = 0;
            timeLeft = 30;
            gameTime = 0;
            playerY = CANVAS_H / 2;
            bossX = CANVAS_W - 40;
            bossY = CANVAS_H / 2;
            obstacles = [];
            document.getElementById('scoreValue').textContent = "0.0";
            document.getElementById('timeValue').textContent = "30.0";
            document.getElementById('btnStart').disabled = true;
        }

        function endGame() {
            gameState = "idle";
            document.getElementById('btnStart').disabled = false;

            const finalScore = Math.floor(gameTime * 100);
            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, finalScore);
            }
        }

        document.getElementById('btnStart').addEventListener('click', startGame);

        document.addEventListener('keydown', (e) => {
            keysPressed[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keysPressed[e.key] = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameState === "running") {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const y = touch.clientY - rect.top;
                if (y < CANVAS_H / 2) {
                    keysPressed['ArrowUp'] = true;
                } else {
                    keysPressed['ArrowDown'] = true;
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            keysPressed['ArrowUp'] = false;
            keysPressed['ArrowDown'] = false;
        }, { passive: true });

        gameLoop();
    </script>
</body>

</html>
