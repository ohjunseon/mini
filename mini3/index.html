<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>점프 타워 (mini3)</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 0 auto;
      background: linear-gradient(#0a1636, #081124 60%, #060a18);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      image-rendering: pixelated;
      max-width: 100%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header class="mb-4">
          <h1>🏰 점프 타워</h1>
          <p>발판을 밟고 최대한 높이 올라가세요!</p>
        </header>

        <div class="hud">
          <div>점수: <span id="score">0</span></div>
          <div>최고: <span id="best">0</span></div>
        </div>

        <div style="position: relative; width: 300px; margin: 0 auto;">
          <canvas id="game" width="300" height="500"></canvas>

          <!-- Start Overlay -->
          <div id="startOv"
            style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); border-radius: 12px;">
            <div style="text-align: center;">
              <button id="btnStart" class="btn">▶️ 게임 시작</button>
              <p class="mt-4" style="font-size: 0.9rem;">PC: 방향키 / Mobile: 아래 버튼</p>
            </div>
          </div>

          <!-- Game Over Overlay -->
          <div id="overOv"
            style="display: none; position: absolute; inset: 0; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); border-radius: 12px;">
            <div style="text-align: center;">
              <h3>게임 오버</h3>
              <p>최종 점수: <b id="final">0</b></p>
              <button id="btnAgain" class="btn">🔁 다시하기</button>
            </div>
          </div>
        </div>

        <!-- Mobile Controls -->
        <div class="controls mt-4" style="display: flex; gap: 10px; justify-content: center;">
          <button class="btn secondary" id="padL" style="padding: 15px 30px;">◀</button>
          <button class="btn secondary" id="padR" style="padding: 15px 30px;">▶</button>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>

        <!-- Leaderboard -->
        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 랭킹</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
            <li>불러오는 중...</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../shared/firebase.js"></script>

  <script>
    const PAGE_ID = "mini3";
    const rankList = document.getElementById('rankList');

    if (window.GameStats) {
      GameStats.listenTopScores(PAGE_ID, 5, (arr) => {
        rankList.innerHTML = "";
        if (!arr || arr.length === 0) { rankList.innerHTML = "<li>기록 없음</li>"; return; }
        arr.forEach((item, idx) => {
          const li = document.createElement('li');
          li.textContent = `${idx + 1}위: ${item.name} - ${item.score}점`;
          rankList.appendChild(li);
        });
      });
    }

    // ==== Game Logic ====
    const W = 300, H = 500;
    const cvs = document.getElementById('game');
    const ctx = cvs.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const finalEl = document.getElementById('final');
    const ovStart = document.getElementById('startOv');
    const ovOver = document.getElementById('overOv');

    document.getElementById('btnStart').onclick = start;
    document.getElementById('btnAgain').onclick = start;

    const padL = document.getElementById('padL');
    const padR = document.getElementById('padR');

    const G = 0.35;
    const VX = 1.05;
    const FRI = 0.90;
    const JUMP_V = -9.8;
    const GAP_MIN = 55, GAP_MAX = 85;
    const PF_W_MIN = 50, PF_W_MAX = 120;

    const keys = { left: false, right: false };
    let running = false;

    let player, plats, score = 0, best = Number(localStorage.getItem('jt_best') || 0);
    let spawnSafe = 0;
    bestEl.textContent = best;

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function makeLevel() {
      plats = [];
      plats.push({ x: W / 2 - 60, y: H - 20, w: 120, h: 10, type: 'base' });
      let y = H - 80;
      while (y > -H) {
        const w = rnd(PF_W_MIN, PF_W_MAX);
        const x = rnd(10, W - 10 - w);
        plats.push({ x, y, w, h: 10, type: (Math.random() < 0.18 ? 'move' : 'norm'), vx: (Math.random() < 0.5 ? 0.6 : -0.6) });
        y -= rnd(GAP_MIN, GAP_MAX);
      }
    }

    function reset() {
      makeLevel();
      let base = plats[0];
      for (const p of plats) { if (p.y > base.y) base = p; }
      const pw = 20, ph = 24;
      player = {
        x: base.x + base.w / 2 - pw / 2,
        y: base.y - ph - 1,
        w: pw, h: ph,
        vx: 0, vy: 0, alive: true
      };
      score = 0; scoreEl.textContent = '0';
    }

    function start() {
      reset(); running = true; spawnSafe = 60;
      ovStart.style.display = 'none';
      ovOver.style.display = 'none';
      last = 0; loop();
    }

    function gameOver() {
      running = false; finalEl.textContent = Math.floor(score);
      best = Math.max(best, Math.floor(score));
      localStorage.setItem('jt_best', best);
      bestEl.textContent = best;
      ovOver.style.display = 'flex'; // Use flex to center content

      // Save Score
      if (score > 0) {
        const nick = localStorage.getItem('nickname') || prompt("닉네임을 입력하세요:") || "익명";
        localStorage.setItem('nickname', nick);
        if (window.GameStats) GameStats.saveScore(PAGE_ID, nick, Math.floor(score));
      }
    }

    // Input
    window.addEventListener('keydown', e => {
      if (ovStart.style.display !== 'none' && (e.key === ' ' || e.key === 'Enter')) return start();
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    const setPad = (dir, val) => { keys[dir] = val; };
    const padEvs = ['pointerdown', 'mousedown', 'touchstart'];
    const padEndEvs = ['pointerup', 'mouseleave', 'touchend', 'pointercancel'];

    padEvs.forEach(ev => {
      padL.addEventListener(ev, (e) => { e.preventDefault(); setPad('left', true) });
      padR.addEventListener(ev, (e) => { e.preventDefault(); setPad('right', true) });
    });
    padEndEvs.forEach(ev => {
      padL.addEventListener(ev, (e) => { e.preventDefault(); setPad('left', false) });
      padR.addEventListener(ev, (e) => { e.preventDefault(); setPad('right', false) });
    });

    // Update
    function update(dt) {
      if (!player.alive) return;
      if (spawnSafe > 0) spawnSafe--;

      if (keys.left) player.vx -= VX * dt;
      if (keys.right) player.vx += VX * dt;
      player.vx *= FRI; player.x += player.vx * dt;
      if (player.x < -player.w) player.x = W; if (player.x > W) player.x = -player.w;

      player.vy += G * dt; player.y += player.vy * dt;

      for (const p of plats) {
        if (p.type === 'move') {
          p.x += p.vx * dt;
          if (p.x < 8 || p.x + p.w > W - 8) p.vx *= -1;
        }
      }

      for (const p of plats) {
        const fromAbove = player.vy > 0 && (player.y + player.h) <= (p.y + player.vy * dt) && (player.y + player.h) >= p.y - 4;
        if (fromAbove && player.x + player.w > p.x && player.x < p.x + p.w) {
          player.y = p.y - player.h; player.vy = JUMP_V;
        }
      }

      if (player.y < 200) {
        const dy = 200 - player.y;
        player.y += dy;
        for (const p of plats) p.y += dy;
        score += dy / 10;
        scoreEl.textContent = String(Math.floor(score));
      }

      if (player.y > H + 40 && spawnSafe <= 0) { player.alive = false; gameOver(); }

      for (let i = plats.length - 1; i >= 0; i--) {
        if (plats[i].y > H + 20) plats.splice(i, 1);
      }
      while (plats.filter(p => p.y < 0).length < 10) {
        const topY = Math.min(...plats.map(p => p.y));
        const w = rnd(PF_W_MIN, PF_W_MAX);
        const x = rnd(10, W - 10 - w);
        const y = topY - rnd(GAP_MIN, GAP_MAX);
        plats.push({ x, y, w, h: 10, type: (Math.random() < 0.2 ? 'move' : 'norm'), vx: (Math.random() < 0.5 ? 0.6 : -0.6) });
      }
    }

    function draw() {
      const grd = ctx.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#0a1636'); grd.addColorStop(1, '#060a18');
      ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#89a';
      for (let i = 0; i < 40; i++) ctx.fillRect((i * 37) % W, (i * 71) % H, 2, 2);

      for (const p of plats) {
        ctx.fillStyle = p.type === 'move' ? '#3f7a9e' : '#2a3e76';
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }

      ctx.fillStyle = '#ffef'; ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#6cf'; ctx.fillRect(player.x + player.w * 0.2, player.y + player.h * 0.22, player.w * 0.6, player.h * 0.28);
    }

    let last = 0;
    function loop(ts) {
      if (!running) return;
      const now = ts || performance.now();
      if (!last) last = now;
      const dt = Math.min(33, now - last);
      last = now;
      update(dt * 0.06);
      draw();
      requestAnimationFrame(loop);
    }
  </script>
</body>

</html>
