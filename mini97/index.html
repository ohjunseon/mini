<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아이스 스케이트</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 20px auto;
      background: linear-gradient(180deg, #e8f4f8, #b8d8e8);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      max-width: 100%;
      cursor: crosshair;
    }
    .canvas-wrapper {
      text-align: center;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameStatus {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin: 15px 0;
      padding: 12px;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>⛸️ 아이스 스케이트</h1>
          <p>마우스로 회전하며 얼음을 활주하세요!</p>
        </header>

        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="320" height="320"></canvas>
        </div>

        <div id="gameStatus">준비 중...</div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">남은 시간</span>
            <span class="stat-value" id="timerValue">25</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">회전 횟수</span>
            <span class="stat-value" id="rotationValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini97";
    const GAME_DURATION = 25;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameStatus = document.getElementById('gameStatus');
    const startBtn = document.getElementById('startBtn');
    const timerValue = document.getElementById('timerValue');
    const rotationValue = document.getElementById('rotationValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let animationId = null;
    let totalScore = 0;
    let rotationCount = 0;

    let skaterX = 160;
    let skaterY = 160;
    let skaterAngle = 0;
    let targetAngle = 0;
    let velocityX = 0;
    let velocityY = 0;
    let isSpinning = false;
    let lastAngle = 0;

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function startGame() {
      gameActive = true;
      timeLeft = GAME_DURATION;
      totalScore = 0;
      rotationCount = 0;
      skaterX = 160;
      skaterY = 160;
      skaterAngle = 0;
      velocityX = 0;
      velocityY = 0;
      startBtn.disabled = true;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerValue.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      gameLoop();
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      if (animationId) cancelAnimationFrame(animationId);
      startBtn.disabled = false;

      gameStatus.textContent = `게임 종료! 최종 점수: ${totalScore}`;

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, totalScore);
        }

        setTimeout(() => {
          totalScore = 0;
          rotationCount = 0;
          timeLeft = GAME_DURATION;
          timerValue.textContent = GAME_DURATION;
          rotationValue.textContent = '0';
          scoreValue.textContent = '0';
          gameStatus.textContent = '준비 중...';
        }, 1000);
      }, 1000);
    }

    function gameLoop() {
      // Ice background
      const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grd.addColorStop(0, '#e8f4f8');
      grd.addColorStop(1, '#b8d8e8');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw ice texture
      ctx.strokeStyle = 'rgba(150, 200, 220, 0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 30) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }

      // Update position
      skaterX += velocityX;
      skaterY += velocityY;
      velocityX *= 0.98;
      velocityY *= 0.98;

      // Boundary
      if (skaterX < 30) {
        skaterX = 30;
        velocityX = -velocityX * 0.5;
      }
      if (skaterX > canvas.width - 30) {
        skaterX = canvas.width - 30;
        velocityX = -velocityX * 0.5;
      }
      if (skaterY < 30) {
        skaterY = 30;
        velocityY = -velocityY * 0.5;
      }
      if (skaterY > canvas.height - 30) {
        skaterY = canvas.height - 30;
        velocityY = -velocityY * 0.5;
      }

      // Smooth rotation
      let angleDiff = targetAngle - skaterAngle;
      if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      skaterAngle += angleDiff * 0.1;

      // Check for full rotations
      const normalizedAngle = ((skaterAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      if (lastAngle < Math.PI && normalizedAngle > Math.PI) {
        rotationCount++;
        totalScore += 50;
      }
      if (lastAngle > Math.PI && normalizedAngle < Math.PI) {
        rotationCount++;
        totalScore += 50;
      }
      lastAngle = normalizedAngle;

      // Draw skater
      ctx.save();
      ctx.translate(skaterX, skaterY);
      ctx.rotate(skaterAngle);

      // Body
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(-8, -15, 16, 30);

      // Head
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(0, -20, 7, 0, Math.PI * 2);
      ctx.fill();

      // Skates
      ctx.fillStyle = '#333333';
      ctx.fillRect(-10, 15, 8, 12);
      ctx.fillRect(2, 15, 8, 12);

      ctx.restore();

      // Draw rotation indicator
      ctx.strokeStyle = 'rgba(91, 156, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(skaterX, skaterY, 40, 0, Math.PI * 2);
      ctx.stroke();

      // Draw rotation progress
      ctx.strokeStyle = 'var(--accent)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(skaterX, skaterY, 40, 0, normalizedAngle);
      ctx.stroke();

      rotationValue.textContent = rotationCount;
      scoreValue.textContent = totalScore;
      animationId = requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      targetAngle = Math.atan2(y - skaterY, x - skaterX);

      // Add velocity towards mouse
      const dx = x - skaterX;
      const dy = y - skaterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 0) {
        velocityX += (dx / dist) * 0.3;
        velocityY += (dy / dist) * 0.3;
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;

      targetAngle = Math.atan2(y - skaterY, x - skaterX);

      const dx = x - skaterX;
      const dy = y - skaterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 0) {
        velocityX += (dx / dist) * 0.3;
        velocityY += (dy / dist) * 0.3;
      }
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
