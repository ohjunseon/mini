<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>슬롯 머신 (mini25)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .slot-machine {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 30px auto;
            padding: 20px;
            background: #222;
            border: 4px solid #dbb700;
            border-radius: 12px;
            width: fit-content;
        }

        .reel {
            width: 60px;
            height: 80px;
            background: #fff;
            color: #000;
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            border: 2px solid #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🎰 슬롯 머신</h1>
                    <p>1000포인트로 시작합니다. 잭팟을 노리세요!</p>
                </header>

                <div class="slot-machine">
                    <div class="reel" id="r1">7</div>
                    <div class="reel" id="r2">7</div>
                    <div class="reel" id="r3">7</div>
                </div>

                <div class="stats-bar mb-4">
                    <div class="stat-item">소지금: <span id="money">1000</span></div>
                    <div class="stat-item">베팅: 50</div>
                </div>

                <div class="controls mt-4">
                    <button id="btnSpin" class="btn">돌리기 (-50)</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹 (최대 소지금)</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../shared/firebase.js"></script>

    <script>
        const PAGE_ID = "mini25";
        if (window.GameStats) GameStats.listenTopScores(PAGE_ID, 5, arr => {
            const rl = document.getElementById('rankList');
            rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
        });

        const syms = ['🍒', '🍋', '🍇', '💎', '7'];
        const r1 = document.getElementById('r1');
        const r2 = document.getElementById('r2');
        const r3 = document.getElementById('r3');
        const btn = document.getElementById('btnSpin');
        const mEl = document.getElementById('money');

        let money = 1000;

        function spinReel(el, duration) {
            return new Promise(resolve => {
                let i = 0;
                const interval = setInterval(() => {
                    el.textContent = syms[Math.floor(Math.random() * syms.length)];
                    i += 50;
                    if (i >= duration) {
                        clearInterval(interval);
                        resolve(el.textContent);
                    }
                }, 50);
            });
        }

        btn.onclick = async () => {
            if (money < 50) { alert('파산했습니다!'); money = 1000; mEl.textContent = money; return; }

            money -= 50;
            mEl.textContent = money;
            btn.disabled = true;

            const p1 = spinReel(r1, 1000);
            const p2 = spinReel(r2, 1500);
            const p3 = spinReel(r3, 2000);

            const v1 = await p1;
            const v2 = await p2;
            const v3 = await p3;

            let prize = 0;
            if (v1 === v2 && v2 === v3) {
                if (v1 === '7') prize = 1000; // Jackpot
                else if (v1 === '💎') prize = 500;
                else prize = 200;
                alert("잭팟! +" + prize);
            } else if (v1 === v2 || v2 === v3 || v1 === v3) {
                prize = 30; // Small win
            }

            money += prize;
            mEl.textContent = money;
            btn.disabled = false;

            // Save
            const nick = localStorage.getItem('nickname') || '익명';
            if (window.GameStats) GameStats.saveScore(PAGE_ID, nick, money);
        };
    </script>
</body>

</html>
