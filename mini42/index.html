<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>빗방울 피하기 (mini42)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        canvas {
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: linear-gradient(180deg, #2c3e50, #1a252f);
            display: block;
            margin: 20px auto;
            max-width: 100%;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🌧️ 빗방울 피하기</h1>
                    <p>빨간 빗방울을 피해서 최대한 오래 살아남으세요!</p>
                </header>

                <canvas id="gameCanvas" width="320" height="480"></canvas>

                <div class="game-info">
                    <div class="info-item">
                        <div class="info-label">생존 시간</div>
                        <div class="info-value" id="timeValue">0.0</div>
                    </div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>
    <script>
        const PAGE_ID = "mini42";
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const CANVAS_W = 320;
        const CANVAS_H = 480;
        const PLAYER_RADIUS = 15;

        let gameState = "idle"; // idle, running, over
        let score = 0;
        let gameTime = 0;
        let playerX = CANVAS_W / 2;
        let playerY = CANVAS_H / 2;

        let raindrops = [];
        let spawnRate = 0.03;
        let fallSpeed = 2;

        // Load ranking
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score.toFixed(1)}초)</li>`).join('');
            });
        }

        class Raindrop {
            constructor() {
                this.x = Math.random() * (CANVAS_W - 20) + 10;
                this.y = -10;
                this.w = 6;
                this.h = 15;
                this.speed = fallSpeed + Math.random() * 1;
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.fillStyle = "#ff4444";
                ctx.fillRect(this.x, this.y, this.w, this.h);
            }

            isOutOfBounds() {
                return this.y > CANVAS_H;
            }

            checkCollision(px, py, pr) {
                const dx = this.x + this.w / 2 - px;
                const dy = this.y + this.h / 2 - py;
                return Math.sqrt(dx * dx + dy * dy) < pr + 5;
            }
        }

        function updateGame() {
            if (gameState !== "running") return;

            gameTime += 0.016; // ~60fps
            score = gameTime;
            document.getElementById("timeValue").textContent = gameTime.toFixed(1);

            // Spawn raindrops
            if (Math.random() < spawnRate) {
                raindrops.push(new Raindrop());
            }

            // Update and check collisions
            for (let i = raindrops.length - 1; i >= 0; i--) {
                raindrops[i].update();

                if (raindrops[i].checkCollision(playerX, playerY, PLAYER_RADIUS)) {
                    gameState = "over";
                    gameEnd();
                    return;
                } else if (raindrops[i].isOutOfBounds()) {
                    raindrops.splice(i, 1);
                }
            }

            // Increase difficulty over time
            if (gameTime > 5) spawnRate = 0.04;
            if (gameTime > 10) spawnRate = 0.05;
            if (gameTime > 20) spawnRate = 0.06;

            // Time limit
            if (gameTime >= 25) {
                gameState = "over";
                gameEnd();
            }
        }

        function drawGame() {
            ctx.fillStyle = "rgba(44, 62, 80, 0.8)";
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Draw raindrops
            raindrops.forEach(drop => drop.draw());

            // Draw player
            ctx.fillStyle = "#44ff44";
            ctx.beginPath();
            ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#22ff22";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function gameEnd() {
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStart").textContent = "다시 시작";

            const name = prompt("이름을 입력하세요:", "익명") || "익명";
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    resetGame();
                });
            }
        }

        function resetGame() {
            score = 0;
            gameTime = 0;
            playerX = CANVAS_W / 2;
            playerY = CANVAS_H / 2;
            raindrops = [];
            spawnRate = 0.03;
            document.getElementById("timeValue").textContent = "0.0";
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.getElementById("btnStart").addEventListener("click", () => {
            gameState = "running";
            resetGame();
            document.getElementById("btnStart").disabled = true;
        });

        document.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            playerX = Math.max(PLAYER_RADIUS, Math.min(CANVAS_W - PLAYER_RADIUS, e.clientX - rect.left));
            playerY = Math.max(PLAYER_RADIUS, Math.min(CANVAS_H - PLAYER_RADIUS, e.clientY - rect.top));
        });

        document.addEventListener("touchmove", (e) => {
            const rect = canvas.getBoundingClientRect();
            if (e.touches.length > 0) {
                playerX = Math.max(PLAYER_RADIUS, Math.min(CANVAS_W - PLAYER_RADIUS, e.touches[0].clientX - rect.left));
                playerY = Math.max(PLAYER_RADIUS, Math.min(CANVAS_H - PLAYER_RADIUS, e.touches[0].clientY - rect.top));
            }
        }, { passive: true });

        gameLoop();
    </script>
</body>

</html>
