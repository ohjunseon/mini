<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숫자 맞추기</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🧠 숫자 맞추기</h1>
          <p>표시되는 숫자 순서를 기억하고 따라하세요!</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">레벨</span>
            <span class="stat-value" id="levelValue">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">준비 중...</span>
          </div>
        </div>

        <div style="
          padding: 20px;
          background: var(--panel);
          border-radius: 12px;
          margin: 20px 0;
          text-align: center;
        ">
          <div id="sequence" style="
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            min-height: 50px;
            margin-bottom: 20px;
          ">대기 중</div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-num" data-num="1">1</button>
            <button class="btn btn-num" data-num="2">2</button>
            <button class="btn btn-num" data-num="3">3</button>
            <button class="btn btn-num" data-num="4">4</button>
          </div>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn btn-primary" id="startBtn">🎮 게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (높은 레벨)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini64";
    const sequenceEl = document.getElementById('sequence');
    const levelValueEl = document.getElementById('levelValue');
    const statusTextEl = document.getElementById('statusText');
    const scoreValueEl = document.getElementById('scoreValue');
    const startBtn = document.getElementById('startBtn');
    const numBtns = document.querySelectorAll('.btn-num');
    const rankList = document.getElementById('rankList');

    let sequence = [];
    let userSequence = [];
    let level = 1;
    let gameActive = false;
    let isPlayingSequence = false;
    let buttonCount = 4;

    function initializeGame() {
      sequence = [];
      userSequence = [];
      level = 1;
      gameActive = true;
      statusTextEl.textContent = '시작되었습니다!';
      levelValueEl.textContent = level;
      scoreValueEl.textContent = level - 1;
      startBtn.disabled = true;
      playNextRound();
    }

    function playNextRound() {
      userSequence = [];
      // Add random button to sequence
      const num = Math.floor(Math.random() * buttonCount) + 1;
      sequence.push(num);
      isPlayingSequence = true;

      // Show sequence
      let delay = 500;
      sequence.forEach((num) => {
        setTimeout(() => {
          flashButton(num);
        }, delay);
        delay += 600;
      });

      setTimeout(() => {
        isPlayingSequence = false;
        statusTextEl.textContent = '당신의 차례!';
      }, delay);
    }

    function flashButton(num) {
      const btn = document.querySelector(`[data-num="${num}"]`);
      btn.style.transform = 'scale(1.1)';
      btn.style.opacity = '0.8';
      setTimeout(() => {
        btn.style.transform = 'scale(1)';
        btn.style.opacity = '1';
      }, 300);
    }

    function handleButtonClick(num) {
      if (!gameActive || isPlayingSequence) return;

      flashButton(num);
      userSequence.push(num);

      if (userSequence[userSequence.length - 1] !== sequence[userSequence.length - 1]) {
        // Wrong!
        gameActive = false;
        statusTextEl.textContent = '틀렸습니다!';
        startBtn.disabled = false;
        saveScore(level - 1);
        return;
      }

      if (userSequence.length === sequence.length) {
        // Correct round!
        level++;
        levelValueEl.textContent = level;
        scoreValueEl.textContent = level - 1;
        statusTextEl.textContent = '맞습니다! 다음 라운드...';
        setTimeout(playNextRound, 1500);
      }
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. 레벨 ${s.score}</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    startBtn.addEventListener('click', initializeGame);

    numBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const num = parseInt(btn.getAttribute('data-num'));
        handleButtonClick(num);
      });
    });

    // Style buttons
    numBtns.forEach(btn => {
      btn.style.cssText = `
        padding: 40px;
        font-size: 1.5rem;
        font-weight: bold;
        background: var(--accent);
        color: var(--text);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.1s;
      `;
    });

    loadTopScores();
  </script>
</body>

</html>
