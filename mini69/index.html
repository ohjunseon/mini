<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타일 매치</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .match-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 15px;
      background: var(--panel);
      border-radius: 12px;
      margin: 20px auto;
      max-width: 300px;
    }

    .match-tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      border-radius: 8px;
      border: 2px solid var(--panel-border);
      cursor: pointer;
      background: var(--accent);
      transition: all 0.1s;
      user-select: none;
    }

    .match-tile:hover {
      transform: scale(1.08);
    }

    .match-tile.flipped {
      background: var(--accent);
      color: var(--text);
    }

    .match-tile.hidden {
      background: var(--panel-border);
      color: transparent;
    }

    .match-tile.matched {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🎴 타일 매치</h1>
          <p>같은 쌍을 찾아보세요!</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">찾은 쌍</span>
            <span class="stat-value" id="matchCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <div class="match-grid" id="matchGrid"></div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">게임 시작</span>
          </div>
        </div>

        <button class="btn btn-primary" id="restartBtn">🔄 새로운 게임</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (많은 점수)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini69";
    const matchGridEl = document.getElementById('matchGrid');
    const matchCountEl = document.getElementById('matchCount');
    const scoreValueEl = document.getElementById('scoreValue');
    const statusTextEl = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const rankList = document.getElementById('rankList');

    const SYMBOLS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉', '🍒', '🍑'];

    let tiles = [];
    let flipped = [];
    let matched = new Set();
    let score = 0;
    let gameActive = true;

    function initializeGame() {
      // Create tile pairs
      const tileValues = [...SYMBOLS, ...SYMBOLS];
      tiles = tileValues.sort(() => Math.random() - 0.5);
      flipped = Array(16).fill(false);
      matched.clear();
      score = 0;
      gameActive = true;
      statusTextEl.textContent = '게임 중...';
      matchCountEl.textContent = '0';
      scoreValueEl.textContent = '0';
      draw();
    }

    function draw() {
      matchGridEl.innerHTML = '';
      tiles.forEach((symbol, idx) => {
        const tile = document.createElement('div');
        tile.className = 'match-tile';

        if (matched.has(idx)) {
          tile.classList.add('matched');
          tile.textContent = symbol;
        } else if (flipped[idx]) {
          tile.classList.add('flipped');
          tile.textContent = symbol;
        } else {
          tile.classList.add('hidden');
          tile.textContent = '?';
        }

        tile.addEventListener('click', () => flipTile(idx));
        matchGridEl.appendChild(tile);
      });
    }

    function flipTile(idx) {
      if (!gameActive || matched.has(idx) || flipped[idx]) return;

      // Only allow 2 flipped at a time
      const activeFlipped = flipped.map((v, i) => v && !matched.has(i) ? i : -1).filter(v => v !== -1);
      if (activeFlipped.length >= 2) return;

      flipped[idx] = true;
      draw();

      const newActiveFlipped = flipped.map((v, i) => v && !matched.has(i) ? i : -1).filter(v => v !== -1);
      if (newActiveFlipped.length === 2) {
        const idx1 = newActiveFlipped[0];
        const idx2 = newActiveFlipped[1];

        if (tiles[idx1] === tiles[idx2]) {
          // Match!
          matched.add(idx1);
          matched.add(idx2);
          score += 1;
          matchCountEl.textContent = score;
          scoreValueEl.textContent = score * 10;

          if (matched.size === 16) {
            gameActive = false;
            statusTextEl.textContent = '완료!';
            saveScore(score * 10);
          }
        } else {
          // No match
          setTimeout(() => {
            flipped[idx1] = false;
            flipped[idx2] = false;
            draw();
          }, 1000);
        }
      }
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. ${s.score}점</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    restartBtn.addEventListener('click', initializeGame);

    initializeGame();
    loadTopScores();
  </script>
</body>

</html>
