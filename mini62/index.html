<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>색상 배치 게임</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🎨 색상 배치</h1>
          <p>각 칸의 색상을 회전하여 목표 패턴을 만드세요! (20초)</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">시간</span>
            <span class="stat-value" id="timeLeft">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <canvas id="gameCanvas" width="320" height="400" style="
          display: block;
          margin: 20px auto;
          background: var(--panel);
          border-radius: 12px;
          cursor: pointer;
          border: 1px solid var(--panel-border);
        "></canvas>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">게임 중...</span>
          </div>
        </div>

        <button class="btn btn-primary" id="restartBtn">🔄 새로운 게임</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (높은 점수)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini62";
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const timeLeftEl = document.getElementById('timeLeft');
    const scoreValueEl = document.getElementById('scoreValue');
    const statusTextEl = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const rankList = document.getElementById('rankList');

    const GRID_SIZE = 3;
    const CELL_SIZE = 100;
    const COLORS = ['#5b9cff', '#ff9a5b', '#2ecc71'];

    let grid = [];
    let targetPattern = [];
    let timeLeft = 20;
    let score = 0;
    let gameActive = true;
    let matchCount = 0;
    let timer = null;

    function initializeGame() {
      grid = Array(GRID_SIZE * GRID_SIZE).fill(0).map(() => Math.floor(Math.random() * 3));
      generateTargetPattern();
      matchCount = 0;
      timeLeft = 20;
      score = 0;
      gameActive = true;
      statusTextEl.textContent = '게임 중...';
      draw();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function generateTargetPattern() {
      targetPattern = Array(GRID_SIZE * GRID_SIZE).fill(0).map(() => Math.floor(Math.random() * 3));
    }

    function rotateCell(index) {
      if (!gameActive) return;
      grid[index] = (grid[index] + 1) % 3;
      checkMatches();
      draw();
    }

    function checkMatches() {
      let newMatches = 0;
      for (let i = 0; i < grid.length; i++) {
        if (grid[i] === targetPattern[i]) {
          newMatches++;
        }
      }
      const diff = newMatches - matchCount;
      if (diff > 0) {
        matchCount = newMatches;
        score += diff * 10;
        scoreValueEl.textContent = score;
        if (matchCount === GRID_SIZE * GRID_SIZE) {
          generateTargetPattern();
          matchCount = 0;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#121931';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw target pattern (top half)
      ctx.fillStyle = '#2a2f3a';
      ctx.fillRect(10, 10, 300, 140);
      ctx.fillStyle = var('--accent');
      ctx.font = '12px sans-serif';
      ctx.fillText('목표 패턴:', 20, 30);

      for (let i = 0; i < targetPattern.length; i++) {
        const row = Math.floor(i / GRID_SIZE);
        const col = i % GRID_SIZE;
        const x = 30 + col * 90;
        const y = 50 + row * 40;
        ctx.fillStyle = COLORS[targetPattern[i]];
        ctx.fillRect(x, y, 35, 35);
        ctx.strokeStyle = '#5b9cff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, 35, 35);
      }

      // Draw current grid (bottom half)
      ctx.fillStyle = '#2a2f3a';
      ctx.fillRect(10, 160, 300, 230);
      ctx.fillStyle = '#9fb3d9';
      ctx.fillText('현재 상태:', 20, 180);

      for (let i = 0; i < grid.length; i++) {
        const row = Math.floor(i / GRID_SIZE);
        const col = i % GRID_SIZE;
        const x = 30 + col * 90;
        const y = 200 + row * 60;
        ctx.fillStyle = COLORS[grid[i]];
        ctx.fillRect(x, y, 80, 50);
        ctx.strokeStyle = '#5b9cff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, 80, 50);
      }
    }

    function endGame() {
      gameActive = false;
      clearInterval(timer);
      statusTextEl.textContent = '게임 종료!';
      saveScore(score);
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. ${s.score}점</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left - 30;
      const y = e.clientY - rect.top - 200;

      if (y >= 0) {
        const row = Math.floor(y / 60);
        const col = Math.floor(x / 90);
        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
          rotateCell(row * GRID_SIZE + col);
        }
      }
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const x = touch.clientX - rect.left - 30;
      const y = touch.clientY - rect.top - 200;

      if (y >= 0) {
        const row = Math.floor(y / 60);
        const col = Math.floor(x / 90);
        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
          rotateCell(row * GRID_SIZE + col);
        }
      }
    });

    restartBtn.addEventListener('click', initializeGame);

    // Initialize
    initializeGame();
    loadTopScores();
  </script>
</body>

</html>
