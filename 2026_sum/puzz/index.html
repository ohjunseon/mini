<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말씀 퍼즐 게임</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🧩</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      min-height: 600px;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .progress {
      text-align: center;
      color: #667eea;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .question {
      background: #f8f9ff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      border-left: 4px solid #667eea;
    }
    .question-text {
      font-size: 18px;
      color: #333;
      line-height: 1.6;
    }
    .zone-label {
      font-size: 13px;
      color: #777;
      margin: 20px 0 8px;
      font-weight: 500;
    }
    #board, #pool {
      min-height: 80px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    #board {
      background: #fff;
      border: 2px solid #667eea;
    }
    #pool {
      background: #f8f9ff;
      border: 2px dashed #bbb;
    }
    .chip {
      padding: 10px 16px;
      background: white;
      border: 2px solid #667eea;
      border-radius: 8px;
      cursor: grab;
      font-size: 16px;
      user-select: none;
      transition: all 0.2s;
    }
    .chip:hover {
      background: #f0f2ff;
    }
    .chip.dragging {
      opacity: 0.4;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .button-group button {
      flex: 1;
    }
    .result-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 30px;
    }
    .result-score {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .result-text {
      font-size: 18px;
    }
    .scoreboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f8f9ff;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
    }
    .scoreboard-rank {
      font-weight: bold;
      color: #667eea;
      min-width: 30px;
    }
    .scoreboard-name {
      flex: 1;
      margin-left: 15px;
    }
    .scoreboard-score {
      font-weight: bold;
      color: #333;
      min-width: 80px;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <h1>🧩 말씀 퍼즐 게임</h1>
    <div class="input-group">
      <label for="studentName">학생 이름을 입력하세요:</label>
      <input type="text" id="studentName" placeholder="예: 김철수">
    </div>
    <button onclick="app.startGame()">게임 시작</button>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="screen">
    <h1>🧩 말씀 퍼즐 게임</h1>
    <div class="progress" id="progress"></div>
    <div class="question">
      <div class="question-text" id="questionRef" style="font-size: 16px; color: #667eea; font-weight: bold;"></div>
    </div>
    <div class="zone-label">여기에 순서대로 배열하세요</div>
    <div id="board"></div>
    <div class="zone-label">섞인 단어들 (드래그해서 위로 옮기세요)</div>
    <div id="pool"></div>
    <div class="button-group">
      <button onclick="app.checkAnswer()">정답 확인</button>
      <button onclick="app.nextQuestion()">다음 문제</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen">
    <h1>🎉 게임 완료!</h1>
    <div class="result-box">
      <div style="font-size: 16px; margin-bottom: 20px;" id="resultName"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-text" id="resultText"></div>
    </div>
    <button onclick="app.goToScoreboard()">순위 확인</button>
    <button onclick="app.goToStart()">처음부터 다시</button>
  </div>

  <!-- 스코어보드 화면 -->
  <div id="scoreboardScreen" class="screen">
    <h1>📊 실시간 순위</h1>
    <div id="scoreboardList"></div>
    <button onclick="app.goToStart()">처음으로</button>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, set, update, get, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEACVa7Zy28gnue2oiKiNiGvP8sHej-d8",
    authDomain: "sum-db225.firebaseapp.com",
    databaseURL: "https://sum-db225-default-rtdb.firebaseio.com",
    projectId: "sum-db225",
    storageBucket: "sum-db225.firebasestorage.app",
    messagingSenderId: "6014588464",
    appId: "1:6014588464:web:a52ea3457a0393ec8abff5",
    measurementId: "G-8SFZSPG0X5"
  };

  const firebase_app = initializeApp(firebaseConfig);
  const db = getDatabase(firebase_app);

  let gameState = {
    currentScreen: 'start',
    studentName: '',
    playerId: '',
    currentQuestionIndex: 0,
    questions: [],
    answers: [],
    correctCount: 0,
    dragEl: null
  };

  async function loadQuestions() {
    try {
      const response = await fetch('./puzzles.json');
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      gameState.questions = await response.json();
      console.log('puzzles.json 로드 완료:', gameState.questions);
    } catch (error) {
      console.error('puzzles.json 로드 실패:', error);
      alert('문제 파일을 불러올 수 없습니다.');
    }
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.remove('active');
    });
    document.getElementById(screenId).classList.add('active');
    gameState.currentScreen = screenId;
  }

  function makeChip(word) {
    const el = document.createElement('div');
    el.textContent = word;
    el.className = 'chip';
    el.draggable = true;
    el.addEventListener('dragstart', () => {
      gameState.dragEl = el;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
    });
    return el;
  }

  function setupDropzone(zone) {
    zone.addEventListener('dragover', e => e.preventDefault());
    zone.addEventListener('drop', e => {
      e.preventDefault();
      if (gameState.dragEl) {
        zone.appendChild(gameState.dragEl);
      }
    });
  }

  function displayQuestion() {
    const question = gameState.questions[gameState.currentQuestionIndex];
    console.log('현재 문제:', question);
    const refElement = document.getElementById('questionRef');
    if (question && question.reference) {
      refElement.textContent = question.reference;
    } else {
      refElement.textContent = '성경 구절을 찾을 수 없습니다';
    }
    document.getElementById('progress').textContent =
      `문제 ${gameState.currentQuestionIndex + 1} / ${gameState.questions.length}`;

    const board = document.getElementById('board');
    const pool = document.getElementById('pool');
    board.innerHTML = '';
    pool.innerHTML = '';

    const words = question.text.split(/\s+/);
    const shuffled = [...words].sort(() => Math.random() - 0.5);

    shuffled.forEach(word => {
      pool.appendChild(makeChip(word));
    });

    setupDropzone(board);
    setupDropzone(pool);
  }

  window.app = {
    startGame: async function() {
      const nameInput = document.getElementById('studentName').value.trim();
      if (!nameInput) {
        alert('이름을 입력해주세요.');
        return;
      }

      gameState.studentName = nameInput;
      gameState.playerId = 'student_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      gameState.currentQuestionIndex = 0;
      gameState.answers = [];
      gameState.correctCount = 0;

      await set(ref(db, 'players/' + gameState.playerId), {
        name: gameState.studentName,
        score: 0,
        total: 0,
        completed: false,
        timestamp: Date.now()
      });

      await loadQuestions();
      showScreen('gameScreen');
      displayQuestion();
    },

    checkAnswer: function() {
      const board = document.getElementById('board');
      const current = [...board.children].map(c => c.textContent);
      const question = gameState.questions[gameState.currentQuestionIndex];
      const answer = question.text.split(/\s+/);

      if (current.length !== answer.length) {
        alert('아직 단어가 남아있어요.');
        return;
      }

      const correct = current.every((w, i) => w === answer[i]);
      if (correct) {
        gameState.correctCount++;
        alert('정답입니다! 🙌');
      } else {
        alert('순서가 틀렸어요. 다시 시도해 보세요.');
      }
      gameState.answers[gameState.currentQuestionIndex] = correct;
    },

    nextQuestion: function() {
      if (gameState.answers[gameState.currentQuestionIndex] === undefined) {
        alert('정답을 확인한 후 진행해주세요.');
        return;
      }

      gameState.currentQuestionIndex++;

      if (gameState.currentQuestionIndex >= gameState.questions.length) {
        window.app.endGame();
      } else {
        displayQuestion();
      }
    },

    endGame: async function() {
      const score = Math.round((gameState.correctCount / gameState.questions.length) * 100);

      await update(ref(db, 'players/' + gameState.playerId), {
        score: gameState.correctCount,
        total: gameState.questions.length,
        percentage: score,
        completed: true,
        finishTime: Date.now()
      });

      document.getElementById('resultName').textContent = gameState.studentName;
      document.getElementById('resultScore').textContent = score + '점';
      document.getElementById('resultText').textContent =
        `${gameState.correctCount}/${gameState.questions.length} 정답`;

      showScreen('resultScreen');
    },

    goToScoreboard: function() {
      showScreen('scoreboardScreen');
      window.app.displayScoreboard();
    },

    displayScoreboard: function() {
      const scoreboardList = document.getElementById('scoreboardList');

      onValue(ref(db, 'players'), (snapshot) => {
        scoreboardList.innerHTML = '';
        const players = [];

        snapshot.forEach((child) => {
          players.push(child.val());
        });

        players.sort((a, b) => {
          if (b.completed === a.completed) {
            return (b.percentage || 0) - (a.percentage || 0);
          }
          return b.completed - a.completed;
        });

        if (players.length === 0) {
          scoreboardList.innerHTML = '<div style="text-align: center; padding: 20px;">아직 시작한 학생이 없습니다.</div>';
          return;
        }

        players.forEach((player, index) => {
          const item = document.createElement('div');
          item.className = 'scoreboard-item';
          const statusText = player.completed ? '완료' : '진행중';
          const percentage = player.total > 0 ? Math.round((player.score / player.total) * 100) : 0;

          item.innerHTML = `
            <div class="scoreboard-rank">#${index + 1}</div>
            <div class="scoreboard-name">${player.name} (${statusText})</div>
            <div class="scoreboard-score">${player.score}/${player.total} (${percentage}%)</div>
          `;
          scoreboardList.appendChild(item);
        });
      });
    },

    goToStart: function() {
      gameState.dragEl = null;
      showScreen('startScreen');
      document.getElementById('studentName').value = '';
    }
  };
</script>

</body>
</html>
