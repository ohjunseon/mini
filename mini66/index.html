<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞춰 없애기</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .game-grid-5x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 10px;
      background: var(--panel);
      border-radius: 12px;
      margin: 20px auto;
      max-width: 280px;
    }

    .cell-circle {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid var(--panel-border);
      cursor: pointer;
      transition: all 0.1s;
    }

    .cell-circle:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🎯 맞춰 없애기</h1>
          <p>같은 색상 3개 이상을 클릭하여 제거하세요! (20초)</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">시간</span>
            <span class="stat-value" id="timeLeft">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <div class="game-grid-5x5" id="gameGrid"></div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">게임 중...</span>
          </div>
        </div>

        <button class="btn btn-primary" id="restartBtn">🔄 새로운 게임</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (높은 점수)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini66";
    const gameGridEl = document.getElementById('gameGrid');
    const timeLeftEl = document.getElementById('timeLeft');
    const scoreValueEl = document.getElementById('scoreValue');
    const statusTextEl = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const rankList = document.getElementById('rankList');

    const COLORS = ['#5b9cff', '#ff9a5b', '#2ecc71', '#ffd166'];
    const GRID_SIZE = 5;

    let grid = [];
    let timeLeft = 20;
    let score = 0;
    let gameActive = true;
    let timer = null;
    let selected = new Set();

    function initializeGame() {
      grid = Array(GRID_SIZE * GRID_SIZE).fill(0).map(() => Math.floor(Math.random() * COLORS.length));
      timeLeft = 20;
      score = 0;
      gameActive = true;
      selected.clear();
      statusTextEl.textContent = '게임 중...';
      draw();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeLeftEl.textContent = timeLeft;

        // Add new cells
        const emptyCells = grid.map((v, i) => v === -1 ? i : -1).filter(v => v !== -1);
        if (emptyCells.length > 0) {
          const idx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
          grid[idx] = Math.floor(Math.random() * COLORS.length);
          draw();
        }

        if (timeLeft <= 0) {
          endGame();
        }
      }, 2000);
    }

    function draw() {
      gameGridEl.innerHTML = '';
      grid.forEach((colorIdx, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell-circle';
        cell.style.background = colorIdx >= 0 ? COLORS[colorIdx] : 'transparent';
        cell.style.opacity = selected.has(i) ? '0.6' : '1';
        cell.addEventListener('click', () => toggleCell(i, colorIdx));
        gameGridEl.appendChild(cell);
      });
    }

    function toggleCell(index, colorIdx) {
      if (!gameActive || colorIdx < 0) return;

      if (selected.has(index)) {
        selected.delete(index);
      } else {
        // Check if same color as others selected
        let canAdd = true;
        for (const idx of selected) {
          if (grid[idx] !== colorIdx) {
            canAdd = false;
            break;
          }
        }
        if (canAdd && selected.size < 10) {
          selected.add(index);
        } else {
          selected.clear();
          selected.add(index);
        }
      }

      if (selected.size >= 3) {
        // Remove cells
        let minColor = -1;
        for (const idx of selected) {
          if (minColor === -1 || grid[idx] < minColor) {
            minColor = grid[idx];
          }
        }

        const sameSizeGroup = new Set();
        for (let i = 0; i < grid.length; i++) {
          if (grid[i] === minColor) {
            // Check if connected to selected
            for (const idx of selected) {
              if (isAdjacent(i, idx)) {
                sameSizeGroup.add(i);
                break;
              }
            }
          }
        }

        if (sameSizeGroup.size >= 3) {
          score += sameSizeGroup.size * 10;
          scoreValueEl.textContent = score;
          for (const idx of sameSizeGroup) {
            grid[idx] = -1;
          }
        }
        selected.clear();
      }

      draw();
    }

    function isAdjacent(idx1, idx2) {
      const row1 = Math.floor(idx1 / GRID_SIZE);
      const col1 = idx1 % GRID_SIZE;
      const row2 = Math.floor(idx2 / GRID_SIZE);
      const col2 = idx2 % GRID_SIZE;

      return (Math.abs(row1 - row2) === 1 && col1 === col2) ||
             (Math.abs(col1 - col2) === 1 && row1 === row2);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timer);
      statusTextEl.textContent = '게임 종료!';
      saveScore(score);
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. ${s.score}점</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    restartBtn.addEventListener('click', initializeGame);

    initializeGame();
    loadTopScores();
  </script>
</body>

</html>
