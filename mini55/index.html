<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>속도 러너 (mini55)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        canvas {
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: linear-gradient(180deg, #1a3a5c, #0f1f3c);
            display: block;
            margin: 20px auto;
            max-width: 100%;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>⚡ 속도 러너</h1>
                    <p>좌우 이동으로 장애물을 피하세요! 시간이 지날수록 빨라집니다! 25초</p>
                </header>

                <canvas id="gameCanvas" width="320" height="480"></canvas>

                <div class="game-info">
                    <div class="info-item">
                        <div class="info-label">시간</div>
                        <div class="info-value" id="timeValue">25.0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">점수</div>
                        <div class="info-value" id="scoreValue">0</div>
                    </div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>
    <script>
        const PAGE_ID = "mini55";
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const CANVAS_W = 320;
        const CANVAS_H = 480;
        const PLAYER_SIZE = 25;
        const PLAYER_Y = CANVAS_H - 50;

        let gameState = "idle";
        let score = 0;
        let timeLeft = 25;
        let gameTime = 0;
        let playerX = CANVAS_W / 2;

        let obstacles = [];
        let scrollSpeed = 4;
        let spawnRate = 0.015;

        let keysPressed = {};

        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        class Obstacle {
            constructor() {
                this.x = CANVAS_W;
                this.y = PLAYER_Y + 10;
                this.w = 30;
                this.h = 35;
            }

            update() {
                this.x -= scrollSpeed;
            }

            draw() {
                ctx.fillStyle = "#ff6b6b";
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = "#ff3333";
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.w, this.h);
            }

            isOutOfBounds() {
                return this.x < -50;
            }

            checkCollision(px, py, ps) {
                return !(px + ps / 2 < this.x || px - ps / 2 > this.x + this.w ||
                    py + ps / 2 < this.y || py - ps / 2 > this.y + this.h);
            }
        }

        function updateGame() {
            if (gameState !== "running") return;

            gameTime += 1 / 60;
            timeLeft = Math.max(0, 25 - gameTime);
            document.getElementById('timeValue').textContent = timeLeft.toFixed(1);

            if (timeLeft <= 0) {
                endGame();
                return;
            }

            // 속도 증가 (선형)
            scrollSpeed = 4 + (gameTime / 25) * 5;

            // 플레이어 이동
            if (keysPressed['a'] || keysPressed['A'] || keysPressed['ArrowLeft']) {
                playerX -= 4;
            }
            if (keysPressed['d'] || keysPressed['D'] || keysPressed['ArrowRight']) {
                playerX += 4;
            }

            if (playerX < PLAYER_SIZE / 2) playerX = PLAYER_SIZE / 2;
            if (playerX > CANVAS_W - PLAYER_SIZE / 2) playerX = CANVAS_W - PLAYER_SIZE / 2;

            // 장애물 생성
            if (Math.random() < spawnRate) {
                obstacles.push(new Obstacle());
            }

            // 장애물 업데이트
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();

                if (obstacles[i].checkCollision(playerX, PLAYER_Y, PLAYER_SIZE)) {
                    endGame();
                    return;
                }

                if (obstacles[i].isOutOfBounds()) {
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('scoreValue').textContent = score;
                }
            }
        }

        function drawGame() {
            // 배경
            ctx.fillStyle = "#0a1a35";
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // 속도 표시
            ctx.fillStyle = "#88ffaa";
            ctx.font = "11px Arial";
            ctx.textAlign = "left";
            ctx.fillText(`Speed: ${scrollSpeed.toFixed(1)}px/f`, 10, 20);

            // 플레이어
            ctx.fillStyle = "#00ff88";
            ctx.fillRect(playerX - PLAYER_SIZE / 2, PLAYER_Y - PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
            ctx.strokeStyle = "#00cc66";
            ctx.lineWidth = 2;
            ctx.strokeRect(playerX - PLAYER_SIZE / 2, PLAYER_Y - PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);

            // 장애물
            obstacles.forEach(obs => obs.draw());

            // UI
            ctx.fillStyle = "#ffffff";
            ctx.font = "11px Arial";
            ctx.fillText("A/D 또는 ← → 이동", 10, 35);
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = "running";
            score = 0;
            timeLeft = 25;
            gameTime = 0;
            playerX = CANVAS_W / 2;
            obstacles = [];
            scrollSpeed = 4;
            document.getElementById('scoreValue').textContent = "0";
            document.getElementById('timeValue').textContent = "25.0";
            document.getElementById('btnStart').disabled = true;
        }

        function endGame() {
            gameState = "idle";
            document.getElementById('btnStart').disabled = false;

            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score);
            }
        }

        document.getElementById('btnStart').addEventListener('click', startGame);

        document.addEventListener('keydown', (e) => {
            keysPressed[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keysPressed[e.key] = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameState === "running") {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                if (x < CANVAS_W / 2) {
                    keysPressed['ArrowLeft'] = true;
                } else {
                    keysPressed['ArrowRight'] = true;
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            keysPressed['ArrowLeft'] = false;
            keysPressed['ArrowRight'] = false;
        }, { passive: true });

        gameLoop();
    </script>
</body>

</html>
