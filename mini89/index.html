<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문자 스크램블</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    #scrambledChars {
      font-size: 2rem;
      font-weight: bold;
      padding: 20px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 12px;
      margin: 20px 0;
      letter-spacing: 10px;
    }
    #answerInput {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
    }
    #answerInput:focus {
      outline: none;
      border-color: var(--accent);
    }
    #answerInput.correct {
      border-color: var(--good);
      background: rgba(46, 204, 113, 0.1);
    }
    #answerInput.incorrect {
      border-color: var(--bad);
      background: rgba(255, 91, 91, 0.1);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }
    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .btn-primary:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }
    .btn-danger {
      background: var(--bad);
      color: white;
    }
    .btn-danger:hover {
      background: #e04646;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🔤 문자 스크램블</h1>
          <p>섞인 글자를 올바른 순서로 재정렬하세요!</p>
        </header>

        <div id="gameArea">
          <div style="font-size: 0.9rem; color: var(--muted); margin: 10px 0;">섞인 글자</div>
          <div id="scrambledChars">준비 중...</div>

          <input type="text" id="answerInput" placeholder="여기에 단어를 입력하세요..." />

          <div style="font-size: 0.85rem; color: var(--muted); margin: 10px 0;">
            정확한 단어를 입력하고 엔터를 누르세요
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="submitBtn" disabled>✓ 제출</button>
          <button class="btn btn-danger" id="skipBtn" disabled>→ 건너뛰기</button>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">남은 시간</span>
            <span class="stat-value" id="timerValue">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">현재</span>
            <span class="stat-value" id="wordCountValue">0/3</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini89";
    const GAME_DURATION = 20;

    const WORDS = [
      'APPLE', 'BOOK', 'CLOUD', 'DREAM', 'ENERGY',
      'FLOWER', 'GROWTH', 'HAPPY', 'INPUT', 'JOURNEY',
      'KEYBOARD', 'LEARN', 'MUSIC', 'NUMBER', 'OUTPUT',
      'PYTHON', 'QUICK', 'RANDOM', 'SPRING', 'TALENT'
    ];

    const scrambledCharsDiv = document.getElementById('scrambledChars');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const skipBtn = document.getElementById('skipBtn');
    const startBtn = document.getElementById('startBtn');
    const timerValue = document.getElementById('timerValue');
    const wordCountValue = document.getElementById('wordCountValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let currentWordIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = GAME_DURATION;
    let selectedWords = [];

    // Load visit count
    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function shuffleWord(word) {
      const arr = word.split('');
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.join('');
    }

    function pickRandomWord() {
      return WORDS[Math.floor(Math.random() * WORDS.length)];
    }

    function nextWord() {
      const input = answerInput.value.toUpperCase().trim();
      const correct = selectedWords[currentWordIndex];

      if (input === correct) {
        score += 10;
        answerInput.classList.remove('incorrect');
        answerInput.classList.add('correct');
      } else {
        answerInput.classList.remove('correct');
        answerInput.classList.add('incorrect');
      }

      scoreValue.textContent = score;

      currentWordIndex++;

      if (currentWordIndex >= selectedWords.length) {
        setTimeout(() => {
          endGame();
        }, 500);
        return;
      }

      setTimeout(() => {
        answerInput.classList.remove('correct', 'incorrect');
        answerInput.value = '';
        answerInput.focus();
        scrambledCharsDiv.textContent = shuffleWord(selectedWords[currentWordIndex]);
        wordCountValue.textContent = (currentWordIndex + 1) + '/3';
      }, 500);
    }

    function skipWord() {
      nextWord();
    }

    function startGame() {
      gameActive = true;
      score = 0;
      currentWordIndex = 0;
      timeLeft = GAME_DURATION;
      selectedWords = [];

      for (let i = 0; i < 3; i++) {
        selectedWords.push(pickRandomWord());
      }

      startBtn.disabled = true;
      submitBtn.disabled = false;
      skipBtn.disabled = false;
      answerInput.disabled = false;
      answerInput.focus();

      scrambledCharsDiv.textContent = shuffleWord(selectedWords[0]);
      wordCountValue.textContent = '1/3';

      timerInterval = setInterval(() => {
        timeLeft--;
        timerValue.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      startBtn.disabled = false;
      submitBtn.disabled = true;
      skipBtn.disabled = true;
      answerInput.disabled = true;

      scrambledCharsDiv.textContent = `게임 종료! 점수: ${score}`;
      answerInput.value = '';

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, score);
        }

        setTimeout(() => {
          scoreValue.textContent = '0';
          wordCountValue.textContent = '0/3';
          timerValue.textContent = GAME_DURATION;
          scrambledCharsDiv.textContent = '준비 중...';
          answerInput.classList.remove('correct', 'incorrect');
        }, 1000);
      }, 1000);
    }

    submitBtn.addEventListener('click', nextWord);
    skipBtn.addEventListener('click', skipWord);
    startBtn.addEventListener('click', startGame);

    answerInput.addEventListener('keydown', (e) => {
      if (e.code === 'Enter' && gameActive) {
        nextWord();
      }
    });
  </script>
</body>
</html>
