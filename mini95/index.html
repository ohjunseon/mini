<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서핑</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 20px auto;
      background: linear-gradient(180deg, #0066cc, #00ccff);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      max-width: 100%;
    }
    .canvas-wrapper {
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameStatus {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin: 15px 0;
      padding: 12px;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🏄 서핑</h1>
          <p>마우스로 파도를 타며 최대한 멀리 가세요!</p>
        </header>

        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="320" height="480"></canvas>
        </div>

        <div id="gameStatus">준비 중...</div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusValue">대기</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">거리</span>
            <span class="stat-value" id="distanceValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini95";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameStatus = document.getElementById('gameStatus');
    const startBtn = document.getElementById('startBtn');
    const statusValue = document.getElementById('statusValue');
    const distanceValue = document.getElementById('distanceValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let totalScore = 0;
    let animationId = null;
    let surfing = false;
    let surfDistance = 0;

    let surferX = 160;
    let surferY = 350;
    let boardX = 160;
    let boardY = 360;
    let waveOffset = 0;
    let waveHeight = 20;

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function startGame() {
      gameActive = true;
      surfing = false;
      surfDistance = 0;
      totalScore = 0;
      surferX = 160;
      surferY = 350;
      boardX = 160;
      boardY = 360;
      waveOffset = 0;
      startBtn.disabled = true;

      gameLoop();
    }

    function endGame() {
      gameActive = false;
      if (animationId) cancelAnimationFrame(animationId);
      startBtn.disabled = false;

      gameStatus.textContent = `게임 종료! 최종 점수: ${totalScore}`;

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, totalScore);
        }

        setTimeout(() => {
          totalScore = 0;
          surfDistance = 0;
          distanceValue.textContent = '0';
          scoreValue.textContent = '0';
          statusValue.textContent = '대기';
          gameStatus.textContent = '준비 중...';
        }, 1000);
      }, 1000);
    }

    function gameLoop() {
      // Ocean background
      const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grd.addColorStop(0, '#0066cc');
      grd.addColorStop(1, '#00ccff');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      waveOffset += 2;
      if (waveOffset > canvas.width) waveOffset = 0;

      // Draw waves
      for (let x = -100; x < canvas.width + 100; x += 80) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i < canvas.width + 100; i += 5) {
          const waveY = 200 + Math.sin((i + waveOffset) / 30) * 30;
          if (i === 0) ctx.moveTo(i, waveY);
          else ctx.lineTo(i, waveY);
        }
        ctx.stroke();
      }

      // Surfboard position
      const waveY = 250 + Math.sin((boardX + waveOffset) / 30) * 20;

      if (surfing) {
        boardX -= 3;
        surfDistance++;
        totalScore += 1;

        if (boardX < -50) {
          endGame();
          return;
        }

        // Tip over
        if (Math.random() < 0.01) {
          surfing = false;
          statusValue.textContent = '떨어짐';
          setTimeout(() => {
            if (gameActive) {
              endGame();
            }
          }, 2000);
          return;
        }
      } else {
        boardX = 160;
        boardY = waveY;
      }

      // Draw board
      ctx.fillStyle = '#ff6b35';
      ctx.beginPath();
      ctx.ellipse(boardX, boardY, 20, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      // Draw surfer on board
      if (surfing) {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(boardX, boardY - 30, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff9900';
        ctx.fillRect(boardX - 6, boardY - 22, 12, 15);
      }

      distanceValue.textContent = Math.floor(surfDistance / 10);
      scoreValue.textContent = totalScore;
      animationId = requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('click', () => {
      if (!gameActive || surfing) return;
      surfing = true;
      statusValue.textContent = '서핑 중!';
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameActive || surfing) return;
      surfing = true;
      statusValue.textContent = '서핑 중!';
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !gameActive) {
        startGame();
      }
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
