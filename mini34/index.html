<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>재빨리 탭하기 (mini34)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .tap-area {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }

        .tap-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: #fff;
            transition: all 0.05s;
            user-select: none;
        }

        .tap-btn:active {
            transform: scale(0.85);
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>⚡ 재빨리 탭하기</h1>
                    <p>15초 동안 나타나는 버튼을 최대한 빨리 클릭하세요!</p>
                </header>

                <div class="timer" id="timer">15.0</div>

                <div class="tap-area" id="tapArea"></div>

                <div class="stats-bar mb-4">
                    <div class="stat-item">점수: <span id="score">0</span></div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>

    <script>
        const PAGE_ID = "mini34";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const tapArea = document.getElementById('tapArea');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const btnStart = document.getElementById('btnStart');

        let score = 0;
        let time = 15.0;
        let running = false;
        let timer = null;
        let spawnTimer = null;

        function spawnButton() {
            if (!running) return;

            const btn = document.createElement('button');
            btn.className = 'tap-btn';
            btn.innerHTML = '●';

            const maxX = tapArea.clientWidth - 80;
            const maxY = tapArea.clientHeight - 80;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            let clicked = false;
            btn.addEventListener('click', () => {
                if (!clicked) {
                    clicked = true;
                    score++;
                    scoreEl.textContent = score;
                    btn.remove();
                }
            });

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!clicked) {
                    clicked = true;
                    score++;
                    scoreEl.textContent = score;
                    btn.remove();
                }
            }, { passive: false });

            tapArea.appendChild(btn);

            setTimeout(() => {
                if (btn.parentNode && !clicked) {
                    btn.remove();
                }
            }, 1500);
        }

        function tick() {
            time -= 0.1;
            timerEl.textContent = time.toFixed(1);
            if (time <= 0) {
                time = 0;
                gameOver();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            clearInterval(spawnTimer);
            btnStart.disabled = false;
            btnStart.textContent = '다시 시작';
            tapArea.innerHTML = '';

            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    scoreEl.textContent = '0';
                    score = 0;
                    time = 15.0;
                    timerEl.textContent = time.toFixed(1);
                });
            }
        }

        btnStart.addEventListener('click', () => {
            if (running) return;
            running = true;
            score = 0;
            time = 15.0;
            scoreEl.textContent = '0';
            timerEl.textContent = '15.0';
            btnStart.disabled = true;
            tapArea.innerHTML = '';

            timer = setInterval(tick, 100);
            spawnTimer = setInterval(spawnButton, 500);
            spawnButton();
        });
    </script>
</body>

</html>
