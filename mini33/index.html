<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>신호등 게임 (mini33)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .traffic-light {
            width: 150px;
            height: 380px;
            background: #333;
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 20px;
        }

        .light {
            width: 100%;
            height: 100px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .light.red {
            background: #FF6B6B;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .light.yellow {
            background: #FFD93D;
            box-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
        }

        .light.green {
            background: #6BCB77;
            box-shadow: 0 0 20px rgba(107, 203, 119, 0.8);
        }

        .light.off {
            background: #555;
            box-shadow: none;
        }

        .click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--accent);
            border: 8px solid #fff;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: all 0.05s;
        }

        .click-btn:active {
            transform: scale(0.92);
        }

        .click-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
        }

        .feedback {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px 0;
            min-height: 30px;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🚦 신호등 게임</h1>
                    <p>30초 동안 초록불에만 클릭하세요!</p>
                </header>

                <div class="timer" id="timer">30.0</div>
                <div class="traffic-light">
                    <div class="light off" id="redLight"></div>
                    <div class="light off" id="yellowLight"></div>
                    <div class="light off" id="greenLight"></div>
                </div>

                <div class="feedback" id="feedback"></div>

                <div class="click-btn" id="clickBtn">클릭!</div>

                <div class="stats-bar mb-4">
                    <div class="stat-item">정확 클릭: <span id="score">0</span></div>
                    <div class="stat-item">실수: <span id="mistakes">0</span></div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>

    <script>
        const PAGE_ID = "mini33";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const clickBtn = document.getElementById('clickBtn');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const mistakesEl = document.getElementById('mistakes');
        const btnStart = document.getElementById('btnStart');
        const feedbackEl = document.getElementById('feedback');
        const redLight = document.getElementById('redLight');
        const yellowLight = document.getElementById('yellowLight');
        const greenLight = document.getElementById('greenLight');

        let score = 0;
        let mistakes = 0;
        let time = 30.0;
        let running = false;
        let timer = null;
        let currentLight = 'off';
        let lightTimer = null;

        function changeLight() {
            const lights = ['red', 'yellow', 'green'];
            const prevLight = currentLight;
            currentLight = lights[Math.floor(Math.random() * lights.length)];

            redLight.className = 'light ' + (currentLight === 'red' ? 'red' : 'off');
            yellowLight.className = 'light ' + (currentLight === 'yellow' ? 'yellow' : 'off');
            greenLight.className = 'light ' + (currentLight === 'green' ? 'green' : 'off');
        }

        function tick() {
            time -= 0.1;
            timerEl.textContent = time.toFixed(1);
            if (time <= 0) {
                time = 0;
                gameOver();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            clearInterval(lightTimer);
            clickBtn.disabled = true;
            btnStart.disabled = false;
            btnStart.textContent = '다시 시작';
            feedbackEl.textContent = '';

            const finalScore = Math.max(0, score - mistakes);
            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, finalScore, () => {
                    scoreEl.textContent = '0';
                    mistakesEl.textContent = '0';
                    score = 0;
                    mistakes = 0;
                    time = 30.0;
                    timerEl.textContent = time.toFixed(1);
                    clickBtn.disabled = false;
                });
            }
        }

        clickBtn.addEventListener('click', () => {
            if (running) {
                if (currentLight === 'green') {
                    score++;
                    scoreEl.textContent = score;
                    feedbackEl.textContent = '✓ 맞았습니다!';
                    setTimeout(() => feedbackEl.textContent = '', 500);
                } else {
                    mistakes++;
                    mistakesEl.textContent = mistakes;
                    feedbackEl.textContent = '✗ 잘못된 신호!';
                    setTimeout(() => feedbackEl.textContent = '', 500);
                }
            }
        });

        clickBtn.addEventListener('touchstart', (e) => {
            if (running) {
                e.preventDefault();
                if (currentLight === 'green') {
                    score++;
                    scoreEl.textContent = score;
                    feedbackEl.textContent = '✓ 맞았습니다!';
                    setTimeout(() => feedbackEl.textContent = '', 500);
                } else {
                    mistakes++;
                    mistakesEl.textContent = mistakes;
                    feedbackEl.textContent = '✗ 잘못된 신호!';
                    setTimeout(() => feedbackEl.textContent = '', 500);
                }
            }
        }, { passive: false });

        btnStart.addEventListener('click', () => {
            if (running) return;
            running = true;
            score = 0;
            mistakes = 0;
            time = 30.0;
            scoreEl.textContent = '0';
            mistakesEl.textContent = '0';
            timerEl.textContent = '30.0';
            btnStart.disabled = true;
            clickBtn.disabled = false;
            feedbackEl.textContent = '';

            timer = setInterval(tick, 100);
            lightTimer = setInterval(changeLight, 800);
            changeLight();
        });
    </script>
</body>

</html>
