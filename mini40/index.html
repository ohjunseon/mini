<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>무한 클릭 (mini40)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--accent);
            border: 8px solid #fff;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            user-select: none;
            transition: all 0.05s;
            position: relative;
        }

        .click-btn:active {
            transform: scale(0.92);
        }

        .click-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cooldown-text {
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
        }

        .cooldown-bar {
            width: 100%;
            max-width: 400px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            margin: 20px auto;
            overflow: hidden;
            border: 2px solid var(--accent);
        }

        .cooldown-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #6BCB77);
            width: 100%;
            transition: width 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #fff;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .stat {
            font-size: 1rem;
            color: var(--muted);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🚀 무한 클릭</h1>
                    <p>30초 동안 시간이 지날수록 빨라집니다!</p>
                </header>

                <div class="timer" id="timer">30.0</div>

                <p style="text-align: center; color: var(--muted); margin: 10px 0;">쿨다운:</p>
                <div class="cooldown-bar">
                    <div class="cooldown-fill" id="cooldownFill" style="width: 100%;">0ms</div>
                </div>

                <div class="click-btn" id="clickBtn">
                    <span>클릭!</span>
                    <span class="cooldown-text" id="cooldownText"></span>
                </div>

                <div class="stats">
                    <div>
                        <div class="stat">점수</div>
                        <div class="stat-value" id="score">0</div>
                    </div>
                    <div>
                        <div class="stat">현재 쿨</div>
                        <div class="stat-value" id="currentCool">300ms</div>
                    </div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>

    <script>
        const PAGE_ID = "mini40";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const clickBtn = document.getElementById('clickBtn');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const btnStart = document.getElementById('btnStart');
        const cooldownFill = document.getElementById('cooldownFill');
        const cooldownText = document.getElementById('cooldownText');
        const currentCoolEl = document.getElementById('currentCool');

        let score = 0;
        let time = 30.0;
        let running = false;
        let timer = null;
        let gameTimer = null;
        let cooldown = 0;
        let baseCooldown = 300;

        function getCurrentCooldown() {
            const elapsed = 30.0 - time;
            const reduction = Math.floor(elapsed * 5);
            return Math.max(50, baseCooldown - reduction);
        }

        function updateCooldownDisplay() {
            const currentCool = getCurrentCooldown();
            currentCoolEl.textContent = currentCool + 'ms';

            if (cooldown > 0) {
                cooldown--;
                const percent = Math.round((cooldown / currentCool) * 100);
                cooldownFill.style.width = percent + '%';
                cooldownFill.textContent = cooldown + 'ms';
                clickBtn.disabled = true;
                cooldownText.textContent = '';
            } else {
                cooldownFill.style.width = '0%';
                cooldownFill.textContent = '0ms';
                clickBtn.disabled = !running;
                cooldownText.textContent = '';
            }
        }

        function tick() {
            time -= 0.1;
            timerEl.textContent = time.toFixed(1);
            if (time <= 0) {
                time = 0;
                gameOver();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            clearInterval(gameTimer);
            clickBtn.disabled = true;
            btnStart.disabled = false;
            btnStart.textContent = '다시 시작';
            cooldownText.textContent = '';

            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    scoreEl.textContent = '0';
                    score = 0;
                    time = 30.0;
                    timerEl.textContent = time.toFixed(1);
                    cooldown = 0;
                    updateCooldownDisplay();
                    currentCoolEl.textContent = '300ms';
                });
            }
        }

        clickBtn.addEventListener('click', () => {
            if (running && cooldown === 0) {
                score++;
                scoreEl.textContent = score;

                const currentCool = getCurrentCooldown();
                cooldown = currentCool;
                clickBtn.disabled = true;

                updateCooldownDisplay();
            }
        });

        clickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (running && cooldown === 0) {
                score++;
                scoreEl.textContent = score;

                const currentCool = getCurrentCooldown();
                cooldown = currentCool;
                clickBtn.disabled = true;

                updateCooldownDisplay();
            }
        }, { passive: false });

        btnStart.addEventListener('click', () => {
            if (running) return;
            running = true;
            score = 0;
            time = 30.0;
            cooldown = 0;
            scoreEl.textContent = '0';
            timerEl.textContent = '30.0';
            btnStart.disabled = true;
            clickBtn.disabled = false;
            cooldownText.textContent = '';
            updateCooldownDisplay();

            timer = setInterval(tick, 100);
            gameTimer = setInterval(updateCooldownDisplay, 10);
        });

        updateCooldownDisplay();
    </script>
</body>

</html>
