<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>번개 타격 (mini36)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .grid-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: #333;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .target-btn {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: #fff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: appear 0.2s forwards;
            user-select: none;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .target-btn:active {
            transform: translate(-50%, -50%) scale(0.85);
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>⚡ 번개 타격</h1>
                    <p>20초 동안 나타나는 요소를 클릭하세요!</p>
                </header>

                <div class="timer" id="timer">20.0</div>

                <div class="grid-area" id="gridArea">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>

                <div class="stats-bar mb-4">
                    <div class="stat-item">점수: <span id="score">0</span></div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>

    <script>
        const PAGE_ID = "mini36";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const gridArea = document.getElementById('gridArea');
        const cells = Array.from(gridArea.querySelectorAll('.grid-cell'));
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const btnStart = document.getElementById('btnStart');

        let score = 0;
        let time = 20.0;
        let running = false;
        let timer = null;
        let spawnTimer = null;

        function spawnTarget() {
            if (!running) return;

            const cellIdx = Math.floor(Math.random() * cells.length);
            const cell = cells[cellIdx];

            if (cell.querySelector('.target-btn')) return;

            const btn = document.createElement('button');
            btn.className = 'target-btn';
            btn.innerHTML = '⚡';

            let clicked = false;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!clicked) {
                    clicked = true;
                    score++;
                    scoreEl.textContent = score;
                    btn.remove();
                }
            });

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!clicked) {
                    clicked = true;
                    score++;
                    scoreEl.textContent = score;
                    btn.remove();
                }
            }, { passive: false });

            cell.appendChild(btn);

            setTimeout(() => {
                if (btn.parentNode && !clicked) {
                    btn.remove();
                }
            }, 1200);
        }

        function tick() {
            time -= 0.1;
            timerEl.textContent = time.toFixed(1);
            if (time <= 0) {
                time = 0;
                gameOver();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            clearInterval(spawnTimer);
            btnStart.disabled = false;
            btnStart.textContent = '다시 시작';

            cells.forEach(cell => {
                const btn = cell.querySelector('.target-btn');
                if (btn) btn.remove();
            });

            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    scoreEl.textContent = '0';
                    score = 0;
                    time = 20.0;
                    timerEl.textContent = time.toFixed(1);
                });
            }
        }

        btnStart.addEventListener('click', () => {
            if (running) return;
            running = true;
            score = 0;
            time = 20.0;
            scoreEl.textContent = '0';
            timerEl.textContent = '20.0';
            btnStart.disabled = true;

            cells.forEach(cell => {
                const btn = cell.querySelector('.target-btn');
                if (btn) btn.remove();
            });

            timer = setInterval(tick, 100);
            spawnTimer = setInterval(spawnTarget, 400);
            spawnTarget();
        });
    </script>
</body>

</html>
