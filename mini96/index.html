<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>탁구</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 20px auto;
      background: #2a5a3a;
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      max-width: 100%;
      cursor: none;
    }
    .canvas-wrapper {
      text-align: center;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameStatus {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin: 15px 0;
      padding: 12px;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🏓 탁구</h1>
          <p>마우스로 라켓을 움직여 공을 계속 튕겨내세요!</p>
        </header>

        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="320" height="320"></canvas>
        </div>

        <div id="gameStatus">준비 중...</div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">남은 시간</span>
            <span class="stat-value" id="timerValue">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">연속 반사</span>
            <span class="stat-value" id="bounceValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini96";
    const GAME_DURATION = 20;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameStatus = document.getElementById('gameStatus');
    const startBtn = document.getElementById('startBtn');
    const timerValue = document.getElementById('timerValue');
    const bounceValue = document.getElementById('bounceValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let animationId = null;
    let totalScore = 0;
    let bounceCount = 0;
    let maxBounce = 0;

    // Game objects
    let ballX = 160;
    let ballY = 160;
    let ballVX = 3;
    let ballVY = 3;
    let racketX = 160;
    let racketY = 280;
    let mouseX = 160;
    let mouseY = 280;

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function startGame() {
      gameActive = true;
      timeLeft = GAME_DURATION;
      totalScore = 0;
      bounceCount = 0;
      maxBounce = 0;
      ballX = 160;
      ballY = 160;
      ballVX = 3;
      ballVY = 3;
      racketX = 160;
      startBtn.disabled = true;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerValue.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      gameLoop();
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      if (animationId) cancelAnimationFrame(animationId);
      startBtn.disabled = false;

      gameStatus.textContent = `게임 종료! 최종 점수: ${totalScore}`;

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, totalScore);
        }

        setTimeout(() => {
          totalScore = 0;
          bounceCount = 0;
          timeLeft = GAME_DURATION;
          timerValue.textContent = GAME_DURATION;
          bounceValue.textContent = '0';
          scoreValue.textContent = '0';
          gameStatus.textContent = '준비 중...';
        }, 1000);
      }, 1000);
    }

    function gameLoop() {
      ctx.fillStyle = '#2a5a3a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw net
      ctx.strokeStyle = '#888888';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 160);
      ctx.lineTo(canvas.width, 160);
      ctx.stroke();

      // Smooth racket movement
      racketX += (mouseX - racketX) * 0.2;

      // Ball physics
      ballX += ballVX;
      ballY += ballVY;

      // Wall bounces
      if (ballX < 8) {
        ballX = 8;
        ballVX = -ballVX;
      }
      if (ballX > canvas.width - 8) {
        ballX = canvas.width - 8;
        ballVX = -ballVX;
      }
      if (ballY < 8) {
        ballY = 8;
        ballVY = -ballVY;
      }

      // Racket bounce
      if (ballY > racketY - 20 && ballY < racketY + 20 &&
          ballX > racketX - 30 && ballX < racketX + 30 &&
          ballVY > 0) {
        ballVY = -ballVY * 1.05;
        ballY = racketY - 20;
        bounceCount++;
        totalScore += 10;

        if (bounceCount > maxBounce) {
          maxBounce = bounceCount;
        }

        // Slight angle based on racket position
        ballVX = (ballX - racketX) * 0.2;
      }

      // Ball out of bounds
      if (ballY > canvas.height) {
        gameActive = false;
        endGame();
        return;
      }

      // Draw ball
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
      ctx.stroke();

      // Draw racket
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(racketX - 30, racketY - 8, 60, 16);

      ctx.strokeStyle = '#ff5555';
      ctx.lineWidth = 2;
      ctx.strokeRect(racketX - 30, racketY - 8, 60, 16);

      // Draw paddle handle
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(racketX - 3, racketY + 8, 6, 20);

      bounceValue.textContent = bounceCount;
      scoreValue.textContent = totalScore;
      animationId = requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      mouseX = touch.clientX - rect.left;
      mouseY = touch.clientY - rect.top;
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
