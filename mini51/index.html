<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>점프 왕국 (mini51)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        canvas {
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: linear-gradient(180deg, #1a3a5c, #0f1f3c);
            display: block;
            margin: 20px auto;
            max-width: 100%;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>🚀 점프 왕국</h1>
                    <p>떨어지는 장애물을 피하세요! 20초 동안 최대한 많이 회피하세요!</p>
                </header>

                <canvas id="gameCanvas" width="320" height="480"></canvas>

                <div class="game-info">
                    <div class="info-item">
                        <div class="info-label">시간</div>
                        <div class="info-value" id="timeValue">20.0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">점수</div>
                        <div class="info-value" id="scoreValue">0</div>
                    </div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>
    <script>
        const PAGE_ID = "mini51";
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const CANVAS_W = 320;
        const CANVAS_H = 480;
        const PLAYER_SIZE = 30;
        const PLAYER_Y = CANVAS_H - 60;

        let gameState = "idle";
        let score = 0;
        let timeLeft = 20;
        let gameTime = 0;
        let playerX = CANVAS_W / 2;
        let isJumping = false;
        let jumpVelocity = 0;
        const GRAVITY = 0.4;
        const JUMP_STRENGTH = -15;

        let obstacles = [];
        let spawnRate = 0.018;
        let fallSpeed = 4;

        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        class Obstacle {
            constructor() {
                this.x = Math.random() * (CANVAS_W - 40) + 20;
                this.y = 0;
                this.w = 40;
                this.h = 30;
            }

            update() {
                this.y += fallSpeed;
            }

            draw() {
                ctx.fillStyle = "#ff6b6b";
                ctx.fillRect(this.x - this.w / 2, this.y, this.w, this.h);
                ctx.strokeStyle = "#ff3333";
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - this.w / 2, this.y, this.w, this.h);
            }

            isOutOfBounds() {
                return this.y > CANVAS_H;
            }

            checkCollision(px, py, ps) {
                const ox = this.x - this.w / 2;
                const oy = this.y;
                return !(px + ps / 2 < ox || px - ps / 2 > ox + this.w ||
                    py + ps / 2 < oy || py - ps / 2 > oy + this.h);
            }
        }

        let playerY = PLAYER_Y;

        function updateGame() {
            if (gameState !== "running") return;

            gameTime += 1 / 60;
            timeLeft = Math.max(0, 20 - gameTime);
            document.getElementById('timeValue').textContent = timeLeft.toFixed(1);

            if (timeLeft <= 0) {
                endGame();
                return;
            }

            // 점프 물리
            if (isJumping) {
                jumpVelocity += GRAVITY;
                playerY += jumpVelocity;

                if (playerY >= PLAYER_Y) {
                    playerY = PLAYER_Y;
                    isJumping = false;
                    jumpVelocity = 0;
                }
            }

            // 장애물 생성
            if (Math.random() < spawnRate) {
                obstacles.push(new Obstacle());
            }

            // 장애물 업데이트
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();

                if (obstacles[i].checkCollision(playerX, playerY, PLAYER_SIZE)) {
                    endGame();
                    return;
                }

                if (obstacles[i].isOutOfBounds()) {
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('scoreValue').textContent = score;
                }
            }
        }

        function drawGame() {
            // 배경
            ctx.fillStyle = "#0a1a35";
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // 플레이어 (원형)
            ctx.fillStyle = "#00ff88";
            ctx.beginPath();
            ctx.arc(playerX, playerY, PLAYER_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#00cc66";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 장애물
            obstacles.forEach(obs => obs.draw());

            // UI
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px Arial";
            ctx.textAlign = "left";
            ctx.fillText("스페이스바 또는 터치로 점프", 10, 20);
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = "running";
            score = 0;
            timeLeft = 20;
            gameTime = 0;
            playerX = CANVAS_W / 2;
            playerY = PLAYER_Y;
            isJumping = false;
            jumpVelocity = 0;
            obstacles = [];
            document.getElementById('scoreValue').textContent = "0";
            document.getElementById('timeValue').textContent = "20.0";
            document.getElementById('btnStart').disabled = true;
        }

        function endGame() {
            gameState = "idle";
            document.getElementById('btnStart').disabled = false;

            const name = prompt('이름을 입력하세요:', '익명') || '익명';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score);
            }
        }

        document.getElementById('btnStart').addEventListener('click', startGame);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameState === "running" && !isJumping) {
                isJumping = true;
                jumpVelocity = JUMP_STRENGTH;
                e.preventDefault();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameState === "running" && !isJumping) {
                isJumping = true;
                jumpVelocity = JUMP_STRENGTH;
                e.preventDefault();
            }
        }, { passive: false });

        gameLoop();
    </script>
</body>

</html>
