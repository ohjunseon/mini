<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>논리 퍼즐</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🧮 논리 퍼즐</h1>
          <p>빠르게 정답을 선택하세요! (20초)</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">시간</span>
            <span class="stat-value" id="timeLeft">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <div style="padding: 20px; background: var(--panel); border-radius: 12px; margin: 20px 0; text-align: center;">
          <div id="problemText" style="
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            min-height: 50px;
            margin-bottom: 20px;
          ">문제를 로딩 중...</div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <button class="btn answer-btn" data-ans="0">A</button>
            <button class="btn answer-btn" data-ans="1">B</button>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn answer-btn" data-ans="2">C</button>
            <button class="btn answer-btn" data-ans="3">D</button>
          </div>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">게임 중...</span>
          </div>
        </div>

        <button class="btn btn-primary" id="restartBtn">🔄 새로운 게임</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (많은 점수)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini67";
    const problemTextEl = document.getElementById('problemText');
    const timeLeftEl = document.getElementById('timeLeft');
    const scoreValueEl = document.getElementById('scoreValue');
    const statusTextEl = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const answerBtns = document.querySelectorAll('.answer-btn');
    const rankList = document.getElementById('rankList');

    const PROBLEMS = [
      { text: "5 + 3 = ?", ans: 1, opts: ["6", "8", "7", "9"] },
      { text: "10 - 4 = ?", ans: 2, opts: ["5", "7", "6", "8"] },
      { text: "3 × 4 = ?", ans: 1, opts: ["10", "12", "14", "16"] },
      { text: "20 ÷ 5 = ?", ans: 3, opts: ["2", "3", "4", "5"] },
      { text: "7 + 8 = ?", ans: 0, opts: ["15", "14", "13", "12"] },
      { text: "12 - 5 = ?", ans: 0, opts: ["7", "8", "9", "10"] },
      { text: "6 × 3 = ?", ans: 2, opts: ["16", "17", "18", "19"] },
      { text: "24 ÷ 4 = ?", ans: 1, opts: ["5", "6", "7", "8"] },
    ];

    let currentProblem = null;
    let timeLeft = 20;
    let score = 0;
    let gameActive = true;
    let timer = null;
    let problemCount = 0;

    function initializeGame() {
      timeLeft = 20;
      score = 0;
      gameActive = true;
      problemCount = 0;
      statusTextEl.textContent = '게임 중...';
      nextProblem();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function nextProblem() {
      if (!gameActive) return;
      currentProblem = PROBLEMS[Math.floor(Math.random() * PROBLEMS.length)];
      problemTextEl.textContent = currentProblem.text;

      answerBtns.forEach((btn, i) => {
        btn.textContent = currentProblem.opts[i];
        btn.disabled = false;
      });
    }

    function checkAnswer(ansIdx) {
      if (!gameActive) return;

      if (ansIdx === currentProblem.ans) {
        score += 1;
        scoreValueEl.textContent = score;
        statusTextEl.textContent = '맞습니다!';
      } else {
        statusTextEl.textContent = '틀렸습니다!';
      }

      setTimeout(() => {
        if (gameActive) {
          statusTextEl.textContent = '게임 중...';
          nextProblem();
        }
      }, 500);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timer);
      statusTextEl.textContent = '게임 종료!';
      answerBtns.forEach(btn => btn.disabled = true);
      saveScore(score);
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. ${s.score}점</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    answerBtns.forEach((btn, i) => {
      btn.addEventListener('click', () => checkAnswer(i));
    });

    restartBtn.addEventListener('click', initializeGame);

    // Style buttons
    answerBtns.forEach(btn => {
      btn.style.cssText = `
        padding: 20px;
        font-size: 1.2rem;
        font-weight: bold;
      `;
    });

    initializeGame();
    loadTopScores();
  </script>
</body>

</html>
