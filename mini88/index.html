<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타이밍 음악</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    canvas {
      display: block;
      margin: 20px auto;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      cursor: pointer;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
    .timing-bar {
      width: 100%;
      height: 30px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      margin: 15px 0;
      overflow: hidden;
      position: relative;
    }
    .timing-progress {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--good));
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🎶 타이밍 음악</h1>
          <p>음악의 비트에 맞춰 클릭하세요!</p>
        </header>

        <canvas id="gameCanvas" width="320" height="300"></canvas>

        <div class="timing-bar">
          <div class="timing-progress" id="timingProgress"></div>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">정확도</span>
            <span class="stat-value" id="accuracyValue">0%</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">콤보</span>
            <span class="stat-value" id="comboValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusValue">대기</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini88";
    const GAME_DURATION = 30;
    const BEAT_INTERVAL = 500; // 500ms per beat

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const scoreValue = document.getElementById('scoreValue');
    const accuracyValue = document.getElementById('accuracyValue');
    const comboValue = document.getElementById('comboValue');
    const statusValue = document.getElementById('statusValue');
    const timingProgress = document.getElementById('timingProgress');
    const rankList = document.getElementById('rankList');

    let gameActive = false;
    let score = 0;
    let totalBeats = 0;
    let correctBeats = 0;
    let combo = 0;
    let gameStartTime = 0;
    let lastBeatTime = 0;
    let animationId = null;
    let beats = [];

    // Load visit count
    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function startGame() {
      gameActive = true;
      score = 0;
      totalBeats = 0;
      correctBeats = 0;
      combo = 0;
      gameStartTime = Date.now();
      lastBeatTime = gameStartTime;
      startBtn.disabled = true;
      beats = [];

      // Generate beat times
      for (let i = 0; i < (GAME_DURATION * 1000) / BEAT_INTERVAL; i++) {
        beats.push({
          time: gameStartTime + i * BEAT_INTERVAL,
          hit: false
        });
      }

      gameLoop();
    }

    function gameLoop() {
      const elapsed = Date.now() - gameStartTime;

      if (elapsed >= GAME_DURATION * 1000) {
        endGame();
        return;
      }

      // Draw canvas
      ctx.fillStyle = 'var(--panel)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw beat indicator
      ctx.fillStyle = 'var(--accent)';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎵', canvas.width / 2, 50);

      // Draw current beat
      const beatNum = Math.floor(elapsed / BEAT_INTERVAL);
      ctx.font = 'bold 48px sans-serif';
      ctx.fillText(beatNum, canvas.width / 2, 150);

      // Draw progress
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'var(--muted)';
      ctx.fillText(
        `${Math.floor(elapsed / 1000)}s / ${GAME_DURATION}s`,
        canvas.width / 2,
        canvas.height - 20
      );

      // Update progress bar
      const progress = (elapsed / (GAME_DURATION * 1000)) * 100;
      timingProgress.style.width = progress + '%';

      // Check for missed beats
      for (const beat of beats) {
        if (!beat.hit && beat.time < Date.now() - 100) {
          beat.hit = true;
          totalBeats++;
        }
      }

      animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameActive = false;
      cancelAnimationFrame(animationId);
      startBtn.disabled = false;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'var(--accent)';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('게임 종료!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '18px sans-serif';
      ctx.fillText(`최종 점수: ${score}`, canvas.width / 2, canvas.height / 2 + 20);

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, score);
        }
      }, 500);
    }

    canvas.addEventListener('click', () => {
      if (!gameActive) return;

      const elapsed = Date.now() - gameStartTime;
      const beatNum = Math.floor(elapsed / BEAT_INTERVAL);
      const timeSinceLastBeat = elapsed - (beatNum * BEAT_INTERVAL);
      const timeToNextBeat = BEAT_INTERVAL - timeSinceLastBeat;

      totalBeats++;
      statusValue.textContent = '클릭!';
      setTimeout(() => {
        statusValue.textContent = '대기';
      }, 200);

      // Check timing accuracy
      let accuracy = 0;
      if (timeSinceLastBeat < 100) {
        accuracy = 100 - timeSinceLastBeat;
        score += Math.round(100 * (accuracy / 100));
        correctBeats++;
        combo++;
      } else if (timeToNextBeat < 100) {
        accuracy = 100 - timeToNextBeat;
        score += Math.round(50 * (accuracy / 100));
        correctBeats++;
        combo++;
      } else {
        combo = 0;
      }

      if (totalBeats > 0) {
        const acc = Math.round((correctBeats / totalBeats) * 100);
        accuracyValue.textContent = acc + '%';
      }

      scoreValue.textContent = score;
      comboValue.textContent = combo;
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
