<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버튼 클릭 레이스 (mini31)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--accent);
            border: 8px solid #fff;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: all 0.05s;
        }

        .click-btn:active {
            transform: scale(0.92);
            background: #2563eb;
        }

        .click-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
  <meta name="description" content="10초 동안 최대한 많이 클릭 - 미니게임">
  <meta name="keywords" content="반응, 미니게임, 게임">
  <meta name="theme-color" content="#5b9cff">
  <meta property="og:title" content="⚡ 버튼 클릭 레이스">
  <meta property="og:description" content="10초 동안 최대한 많이 클릭">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/mini31/cover.png">
  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="⚡ 버튼 클릭 레이스">
  <meta property="twitter:description" content="10초 동안 최대한 많이 클릭">
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>⚡ 버튼 클릭 레이스</h1>
                    <p>10초 동안 최대한 많이 클릭하세요!</p>
                </header>

                <div class="timer" id="timer">10.0</div>
                <div class="click-btn" id="clickBtn">클릭!</div>

                <div class="stats-bar mb-4">
                    <div class="stat-item">점수: <span id="score">0</span></div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
              <div class="mt-4">
                <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
              </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>
    <script src="../shared/juice.js"></script>

    <script>
        const PAGE_ID = "mini31";
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        const clickBtn = document.getElementById('clickBtn');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const btnStart = document.getElementById('btnStart');

        let score = 0;
        let time = 10.0;
        let running = false;
        let timer = null;

        function tick() {
            time -= 0.1;
            timerEl.textContent = time.toFixed(1);
            if (time <= 0) {
                time = 0;
                gameOver();
            }
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            clickBtn.disabled = true;
            btnStart.disabled = false;
            btnStart.textContent = '다시 시작';
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    scoreEl.textContent = '0';
                    score = 0;
                    time = 10.0;
                    timerEl.textContent = time.toFixed(1);
                    clickBtn.disabled = false;
                });
            }
        }

        clickBtn.addEventListener('click', () => {
            if (running) {
                score++;
                scoreEl.textContent = score;
            }
        });

        btnStart.addEventListener('click', () => {
            if (running) return;
            running = true;
            score = 0;
            time = 10.0;
            scoreEl.textContent = '0';
            timerEl.textContent = '10.0';
            btnStart.disabled = true;
            clickBtn.disabled = false;

            timer = setInterval(tick, 100);
        });

        clickBtn.addEventListener('touchstart', (e) => {
            if (running) {
                e.preventDefault();
                score++;
                scoreEl.textContent = score;
            }
        }, { passive: false });
    </script>
</body>

</html>
