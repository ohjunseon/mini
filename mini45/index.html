<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>속도 조절 캐치 (mini45)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        canvas {
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: linear-gradient(180deg, #1a3a5c, #0f1f3c);
            display: block;
            margin: 20px auto;
            max-width: 100%;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-container">
            <div class="card">
                <header class="mb-4">
                    <h1>⚡ 속도 조절 캐치</h1>
                    <p>시간이 지날수록 공이 빨라집니다! 최대한 많이 캐치하세요!</p>
                </header>

                <canvas id="gameCanvas" width="320" height="480"></canvas>

                <div class="game-info">
                    <div class="info-item">
                        <div class="info-label">시간</div>
                        <div class="info-value" id="timeValue">25.0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">점수</div>
                        <div class="info-value" id="scoreValue">0</div>
                    </div>
                </div>

                <div class="controls mt-4">
                    <button id="btnStart" class="btn">게임 시작</button>
                </div>

                <div class="panel mt-4" style="text-align: left;">
                    <h3>🏆 랭킹</h3>
                    <ul id="rankList" style="padding-left: 20px; color: var(--muted); font-size: 0.9rem;">
                        <li>...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/ranking.js"></script>
    <script>
        const PAGE_ID = "mini45";
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const CANVAS_W = 320;
        const CANVAS_H = 480;
        const BASKET_Y = CANVAS_H - 40;
        const BASKET_W = 60;
        const BASKET_H = 20;

        let gameState = "idle";
        let score = 0;
        let timeLeft = 25;
        let gameTime = 0;
        let basketX = CANVAS_W / 2 - BASKET_W / 2;
        let mouseX = CANVAS_W / 2;

        let balls = [];
        let baseFallSpeed = 2;

        // Load ranking
        if (window.GameStats) {
            const rl = document.getElementById('rankList');
            GameStats.listenTopScores(PAGE_ID, 5, arr => {
                rl.innerHTML = (!arr || !arr.length) ? "<li>기록 없음</li>" : arr.map((d, i) => `<li>${i + 1}위 ${d.name} (${d.score})</li>`).join('');
            });
        }

        class Ball {
            constructor() {
                this.x = Math.random() * (CANVAS_W - 20) + 10;
                this.y = -10;
                this.r = 8;
                this.fallSpeed = baseFallSpeed + (gameTime * 0.1);
            }

            update() {
                this.y += this.fallSpeed;
            }

            draw() {
                ctx.fillStyle = "#ff6b6b";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ff5252";
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            isOutOfBounds() {
                return this.y > CANVAS_H;
            }

            checkCollision(bx, bw) {
                return this.x > bx && this.x < bx + bw &&
                    this.y + this.r > BASKET_Y && this.y - this.r < BASKET_Y + BASKET_H;
            }
        }

        function updateGame() {
            if (gameState !== "running") return;

            gameTime += 0.016;
            timeLeft = Math.max(0, 25 - gameTime);
            document.getElementById("timeValue").textContent = timeLeft.toFixed(1);

            // Spawn balls at constant rate
            if (Math.random() < 0.025) {
                balls.push(new Ball());
            }

            // Update and check collisions
            for (let i = balls.length - 1; i >= 0; i--) {
                balls[i].update();

                if (balls[i].checkCollision(basketX, BASKET_W)) {
                    score++;
                    document.getElementById("scoreValue").textContent = score;
                    balls.splice(i, 1);
                } else if (balls[i].isOutOfBounds()) {
                    balls.splice(i, 1);
                }
            }

            basketX = Math.max(0, Math.min(CANVAS_W - BASKET_W, mouseX - BASKET_W / 2));

            if (timeLeft <= 0) {
                gameState = "over";
                gameEnd();
            }
        }

        function drawGame() {
            ctx.fillStyle = "rgba(15, 31, 60, 0.8)";
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Draw falling speed indicator
            const speedPercent = Math.min(100, Math.round((gameTime / 25) * 100));
            ctx.fillStyle = "#444";
            ctx.fillRect(10, 10, 100, 8);
            ctx.fillStyle = "#ff6b6b";
            ctx.fillRect(10, 10, speedPercent, 8);

            // Draw balls
            balls.forEach(ball => ball.draw());

            // Draw basket
            ctx.fillStyle = "#ffb84d";
            ctx.fillRect(basketX, BASKET_Y, BASKET_W, BASKET_H);
            ctx.strokeStyle = "#ff9a1f";
            ctx.lineWidth = 2;
            ctx.strokeRect(basketX, BASKET_Y, BASKET_W, BASKET_H);
        }

        function gameEnd() {
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStart").textContent = "다시 시작";

            const name = prompt("이름을 입력하세요:", "익명") || "익명";
            if (window.GameStats) {
                GameStats.saveScore(PAGE_ID, name, score, () => {
                    resetGame();
                });
            }
        }

        function resetGame() {
            score = 0;
            timeLeft = 25;
            gameTime = 0;
            balls = [];
            basketX = CANVAS_W / 2 - BASKET_W / 2;
            document.getElementById("scoreValue").textContent = "0";
            document.getElementById("timeValue").textContent = "25.0";
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById("btnStart").addEventListener("click", () => {
            gameState = "running";
            resetGame();
            document.getElementById("btnStart").disabled = true;
        });

        document.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        document.addEventListener("touchmove", (e) => {
            const rect = canvas.getBoundingClientRect();
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX - rect.left;
            }
        }, { passive: true });

        gameLoop();
    </script>
</body>

</html>
