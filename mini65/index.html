<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퍼즐 조각 게임</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>

<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🧩 퍼즐 조각</h1>
          <p>떨어지는 블록을 배치하여 줄을 완성하세요! (25초)</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">시간</span>
            <span class="stat-value" id="timeLeft">25</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <canvas id="gameCanvas" width="320" height="480" style="
          display: block;
          margin: 20px auto;
          background: var(--panel);
          border-radius: 12px;
          cursor: pointer;
          border: 1px solid var(--panel-border);
        "></canvas>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">상태</span>
            <span class="stat-value" id="statusText">게임 중...</span>
          </div>
        </div>

        <button class="btn btn-primary" id="restartBtn">🔄 새로운 게임</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (높은 점수)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini65";
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const timeLeftEl = document.getElementById('timeLeft');
    const scoreValueEl = document.getElementById('scoreValue');
    const statusTextEl = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const rankList = document.getElementById('rankList');

    const BLOCK_SIZE = 40;
    const COLS = 8;
    const ROWS = 12;
    const COLORS = ['#5b9cff', '#ff9a5b', '#2ecc71', '#ffd166'];

    let grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
    let currentBlock = null;
    let nextBlock = null;
    let timeLeft = 25;
    let score = 0;
    let gameActive = true;
    let timer = null;
    let selectedCol = -1;

    function initializeGame() {
      grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
      timeLeft = 25;
      score = 0;
      gameActive = true;
      selectedCol = -1;
      statusTextEl.textContent = '게임 중...';
      generateNextBlock();
      generateNextBlock();
      draw();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeLeftEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function generateNextBlock() {
      currentBlock = nextBlock || {
        type: Math.floor(Math.random() * 4),
        col: Math.floor(Math.random() * (COLS - 1))
      };
      nextBlock = {
        type: Math.floor(Math.random() * 4),
        col: Math.floor(Math.random() * (COLS - 1))
      };
    }

    function dropBlock() {
      if (!currentBlock || !gameActive) return;

      const col = selectedCol >= 0 ? selectedCol : currentBlock.col;
      if (col >= 0 && col < COLS) {
        // Find row
        for (let row = ROWS - 1; row >= 0; row--) {
          if (grid[row][col] === 0) {
            grid[row][col] = currentBlock.type + 1;
            break;
          }
        }

        checkRows();
        generateNextBlock();
        selectedCol = -1;
        draw();
      }
    }

    function checkRows() {
      let clearedRows = 0;
      for (let row = ROWS - 1; row >= 0; row--) {
        if (grid[row].every(cell => cell !== 0)) {
          grid.splice(row, 1);
          grid.unshift(Array(COLS).fill(0));
          clearedRows++;
          row++; // Recheck this row
        }
      }
      if (clearedRows > 0) {
        score += clearedRows * 20;
        scoreValueEl.textContent = score;
      }
    }

    function draw() {
      ctx.fillStyle = '#121931';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const x = col * BLOCK_SIZE;
          const y = row * BLOCK_SIZE;
          ctx.strokeStyle = '#2a2f3a';
          ctx.lineWidth = 1;
          ctx.strokeRect(x, y, BLOCK_SIZE, BLOCK_SIZE);

          if (grid[row][col] > 0) {
            ctx.fillStyle = COLORS[grid[row][col] - 1];
            ctx.fillRect(x + 2, y + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
          }
        }
      }

      // Draw next block indicator
      ctx.fillStyle = '#2a2f3a';
      ctx.fillRect(0, 0, canvas.width, 40);
      ctx.fillStyle = '#9fb3d9';
      ctx.font = '12px sans-serif';
      ctx.fillText('다음:', 10, 25);
      ctx.fillStyle = COLORS[nextBlock.type];
      ctx.fillRect(50, 10, 30, 20);

      // Draw hover effect
      if (selectedCol >= 0) {
        ctx.strokeStyle = var('--accent');
        ctx.lineWidth = 3;
        ctx.strokeRect(selectedCol * BLOCK_SIZE, 0, BLOCK_SIZE, BLOCK_SIZE);
      }
    }

    function endGame() {
      gameActive = false;
      clearInterval(timer);
      statusTextEl.textContent = '게임 종료!';
      saveScore(score);
    }

    function saveScore(finalScore) {
      if (window.GameStats) {
        window.GameStats.saveScore(PAGE_ID, finalScore, () => {
          loadTopScores();
        });
      }
    }

    function loadTopScores() {
      if (window.GameStats) {
        window.GameStats.listenTopScores(PAGE_ID, 5, (scores) => {
          rankList.innerHTML = scores.map((s, i) =>
            `<li>${i + 1}. ${s.score}점</li>`
          ).join('') || '<li>기록 없음</li>';
        });
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const col = Math.floor(x / BLOCK_SIZE);
      selectedCol = col >= 0 && col < COLS ? col : -1;
      draw();
    });

    canvas.addEventListener('click', () => {
      dropBlock();
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const x = touch.clientX - rect.left;
      const col = Math.floor(x / BLOCK_SIZE);
      selectedCol = col >= 0 && col < COLS ? col : -1;
      draw();
    });

    canvas.addEventListener('touchstart', () => {
      dropBlock();
    });

    restartBtn.addEventListener('click', initializeGame);

    // Auto-drop blocks
    setInterval(() => {
      if (gameActive) {
        dropBlock();
      }
    }, 2000);

    initializeGame();
    loadTopScores();
  </script>
</body>

</html>
