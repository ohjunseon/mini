<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대전 카드 게임</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .battle-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }
    .side {
      text-align: center;
    }
    .choice-display {
      font-size: 4rem;
      margin: 10px 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .card-btn {
      padding: 15px;
      border-radius: 8px;
      border: 2px solid var(--panel-border);
      background: rgba(0,0,0,0.2);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 2rem;
      transition: all 0.2s;
    }
    .card-btn:hover {
      transform: scale(1.05);
      border-color: var(--accent);
    }
    .card-btn:active {
      transform: scale(0.95);
    }
    .timer-bar {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      margin: 20px 0;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--good), var(--warn), var(--bad));
      width: 100%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>⚔️ 대전 카드 게임</h1>
          <p>컴퓨터와 가위바위보 대전! (20초)</p>
        </header>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">승수</span>
            <span class="stat-value" id="wins">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">시간</span>
            <span class="stat-value" id="timeLeft">20</span>s
          </div>
        </div>

        <div class="timer-bar">
          <div class="timer-fill" id="timerFill"></div>
        </div>

        <div class="battle-area">
          <div class="side">
            <p style="color: var(--muted); margin: 0 0 10px;">당신</p>
            <div class="choice-display" id="playerChoice">-</div>
            <p style="color: var(--good); font-weight: 600; margin-top: 5px;" id="playerWins">0승</p>
          </div>
          <div class="side">
            <p style="color: var(--muted); margin: 0 0 10px;">컴퓨터</p>
            <div class="choice-display" id="computerChoice">-</div>
            <p style="color: var(--accent); font-weight: 600; margin-top: 5px;" id="computerWins">0승</p>
          </div>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center;">
          <p style="margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text);" id="result">카드를 선택하세요!</p>
        </div>

        <div class="card-options">
          <button class="card-btn" onclick="play('rock')">✊<div style="font-size: 0.6rem; margin-top: 5px;">바위</div></button>
          <button class="card-btn" onclick="play('paper')">✋<div style="font-size: 0.6rem; margin-top: 5px;">보</div></button>
          <button class="card-btn" onclick="play('scissors')">✌️<div style="font-size: 0.6rem; margin-top: 5px;">보</div></button>
        </div>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5 (승수 많은 순)</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini77";
    const CHOICES = {
      rock: '✊',
      paper: '✋',
      scissors: '✌️'
    };
    const CHOICE_NAMES = {
      rock: '바위',
      paper: '보',
      scissors: '보'
    };

    let playerWins = 0;
    let computerWins = 0;
    let timeLeft = 20;
    let gameActive = true;
    let timerId = null;

    function getComputerChoice() {
      const choices = Object.keys(CHOICES);
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function determineWinner(player, computer) {
      if (player === computer) return 'tie';
      if (
        (player === 'rock' && computer === 'scissors') ||
        (player === 'paper' && computer === 'rock') ||
        (player === 'scissors' && computer === 'paper')
      ) {
        return 'win';
      }
      return 'lose';
    }

    function play(choice) {
      if (!gameActive) return;

      const computerChoice = getComputerChoice();
      const result = determineWinner(choice, computerChoice);

      document.getElementById('playerChoice').textContent = CHOICES[choice];
      document.getElementById('computerChoice').textContent = CHOICES[computerChoice];

      if (result === 'win') {
        playerWins++;
        document.getElementById('result').textContent = '🎉 이겼습니다!';
        document.getElementById('result').style.color = 'var(--good)';
      } else if (result === 'lose') {
        computerWins++;
        document.getElementById('result').textContent = '😢 졌습니다.';
        document.getElementById('result').style.color = 'var(--bad)';
      } else {
        document.getElementById('result').textContent = '🤝 동점입니다!';
        document.getElementById('result').style.color = 'var(--warn)';
      }

      document.getElementById('playerWins').textContent = `${playerWins}승`;
      document.getElementById('computerWins').textContent = `${computerWins}승`;
      document.getElementById('wins').textContent = playerWins;
    }

    function startGame() {
      timeLeft = 20;
      playerWins = 0;
      computerWins = 0;
      gameActive = true;
      document.getElementById('timeLeft').textContent = "20";
      document.getElementById('wins').textContent = "0";
      document.getElementById('playerChoice').textContent = "-";
      document.getElementById('computerChoice').textContent = "-";
      document.getElementById('playerWins').textContent = "0승";
      document.getElementById('computerWins').textContent = "0승";
      document.getElementById('result').textContent = "카드를 선택하세요!";
      updateTimerBar();

      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timeLeft').textContent = timeLeft;
        updateTimerBar();

        if (timeLeft <= 0) {
          gameActive = false;
          clearInterval(timerId);
          endGame();
        }
      }, 1000);
    }

    function updateTimerBar() {
      const percent = Math.max(0, (timeLeft / 20) * 100);
      document.getElementById('timerFill').style.width = percent + '%';
    }

    function endGame() {
      document.getElementById('result').textContent = `게임 끝! 최종 승수: ${playerWins}`;
      const nick = localStorage.getItem('nickname') || prompt("닉네임을 입력하세요:") || "익명";
      localStorage.setItem('nickname', nick);
      if (window.GameStats) GameStats.saveScore(PAGE_ID, nick, playerWins);
    }

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      GameStats.listenTopScores(PAGE_ID, 5, (arr) => {
        const rankList = document.getElementById('rankList');
        rankList.innerHTML = "";
        if (!arr || arr.length === 0) {
          rankList.innerHTML = "<li>기록이 없습니다.</li>";
          return;
        }
        arr.forEach((item, idx) => {
          const li = document.createElement('li');
          li.textContent = `${idx + 1}위: ${item.name} - ${item.score}승`;
          rankList.appendChild(li);
        });
      });
    }

    startGame();
  </script>
</body>
</html>
