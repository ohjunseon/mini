<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>복싱 훈련</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    #gameContainer {
      background: rgba(91, 156, 255, 0.05);
      padding: 30px;
      border-radius: 12px;
      border: 2px solid var(--panel-border);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #comboDisplay {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent);
      text-align: center;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #nextPunch {
      font-size: 2rem;
      font-weight: bold;
      color: var(--good);
      padding: 20px;
      background: rgba(46, 204, 113, 0.1);
      border-radius: 12px;
      border: 2px solid var(--good);
      min-width: 150px;
      text-align: center;
    }
    #gameStatus {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin: 15px 0;
      padding: 12px;
      background: rgba(91, 156, 255, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      margin: 20px 0;
    }
    .punch-btn {
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
      text-transform: uppercase;
    }
    .punch-btn:hover:not(:disabled) {
      transform: scale(1.05);
    }
    .punch-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .punch-left { background: #ff6b6b; }
    .punch-right { background: #ffd700; }
    .punch-upper { background: #34d399; }
    .punch-lower { background: #a78bfa; }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .stat-item {
      background: rgba(91, 156, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .stat-value {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-container">
      <div class="card">
        <header style="border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 20px;">
          <h1>🥊 복싱 훈련</h1>
          <p>올바른 순서대로 펀치를 입력하세요!</p>
        </header>

        <div id="gameContainer">
          <div id="comboDisplay">준비 중...</div>
          <div id="nextPunch">-</div>
        </div>

        <div id="gameStatus">게임 시작을 누르세요</div>

        <div class="button-group">
          <button class="punch-btn punch-left" id="punchLeft">좌 (L)</button>
          <button class="punch-btn punch-right" id="punchRight">우 (R)</button>
          <button class="punch-btn punch-upper" id="punchUpper">상 (U)</button>
          <button class="punch-btn punch-lower" id="punchLower">하 (D)</button>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">남은 시간</span>
            <span class="stat-value" id="timerValue">20</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">콤보 길이</span>
            <span class="stat-value" id="comboValue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="scoreValue">0</span>
          </div>
        </div>

        <button class="btn" id="startBtn" style="width: 100%; margin: 10px 0;">게임 시작</button>

        <div class="panel mt-4" style="text-align: left;">
          <h3>🏆 Top 5</h3>
          <ul id="rankList" style="padding-left: 20px; color: var(--muted);">
            <li>로딩 중...</li>
          </ul>
        </div>

        <div class="mt-4">
          <a href="../index.html" class="back-link">← 메인으로</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/ranking.js"></script>
  <script>
    const PAGE_ID = "mini98";
    const GAME_DURATION = 20;
    const PUNCH_TYPES = ['L', 'R', 'U', 'D'];
    const PUNCH_LABELS = { 'L': '좌', 'R': '우', 'U': '상', 'D': '하' };

    const startBtn = document.getElementById('startBtn');
    const gameStatus = document.getElementById('gameStatus');
    const comboDisplay = document.getElementById('comboDisplay');
    const nextPunch = document.getElementById('nextPunch');
    const timerValue = document.getElementById('timerValue');
    const comboValue = document.getElementById('comboValue');
    const scoreValue = document.getElementById('scoreValue');
    const rankList = document.getElementById('rankList');

    const punchLeftBtn = document.getElementById('punchLeft');
    const punchRightBtn = document.getElementById('punchRight');
    const punchUpperBtn = document.getElementById('punchUpper');
    const punchLowerBtn = document.getElementById('punchLower');

    let gameActive = false;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let totalScore = 0;
    let currentCombo = [];
    let targetCombo = [];
    let maxCombo = 0;

    if (window.GameStats) {
      GameStats.incrementVisitCount(PAGE_ID, () => {});
      loadRanking();
    }

    function loadRanking() {
      if (window.GameStats && window.GameStats.listenForTopScores) {
        GameStats.listenForTopScores(PAGE_ID, 5, (rows) => {
          rankList.innerHTML = rows.map((r, i) =>
            `<li>${i+1}. ${r.name} - ${r.score} 점</li>`
          ).join('') || '<li>기록이 없습니다</li>';
        });
      }
    }

    function generateCombo() {
      targetCombo = [];
      for (let i = 0; i < Math.floor(Math.random() * 5) + 3; i++) {
        targetCombo.push(PUNCH_TYPES[Math.floor(Math.random() * PUNCH_TYPES.length)]);
      }
      updateDisplay();
    }

    function startGame() {
      gameActive = true;
      timeLeft = GAME_DURATION;
      totalScore = 0;
      currentCombo = [];
      maxCombo = 0;
      startBtn.disabled = true;
      generateCombo();

      timerInterval = setInterval(() => {
        timeLeft--;
        timerValue.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      startBtn.disabled = false;

      gameStatus.textContent = `게임 종료! 최종 점수: ${totalScore}`;

      setTimeout(() => {
        if (window.GameStats) {
          const playerName = prompt('이름을 입력하세요:') || '익명';
          GameStats.saveScore(PAGE_ID, playerName, totalScore);
        }

        setTimeout(() => {
          totalScore = 0;
          currentCombo = [];
          maxCombo = 0;
          timeLeft = GAME_DURATION;
          timerValue.textContent = GAME_DURATION;
          comboValue.textContent = '0';
          scoreValue.textContent = '0';
          comboDisplay.textContent = '준비 중...';
          nextPunch.textContent = '-';
          gameStatus.textContent = '게임 시작을 누르세요';
        }, 1000);
      }, 1000);
    }

    function updateDisplay() {
      comboDisplay.textContent = targetCombo.map(p => PUNCH_LABELS[p]).join(' → ');
      nextPunch.textContent = currentCombo.length < targetCombo.length ? PUNCH_LABELS[targetCombo[currentCombo.length]] : '완료!';
      comboValue.textContent = currentCombo.length;
      scoreValue.textContent = totalScore;
    }

    function handlePunch(punchType) {
      if (!gameActive) return;

      if (currentCombo.length < targetCombo.length && targetCombo[currentCombo.length] === punchType) {
        currentCombo.push(punchType);
        totalScore += 10;

        if (currentCombo.length === targetCombo.length) {
          // Combo complete
          totalScore += currentCombo.length * 5;
          if (currentCombo.length > maxCombo) {
            maxCombo = currentCombo.length;
          }
          currentCombo = [];
          generateCombo();
        }
      } else {
        // Wrong punch
        currentCombo = [];
        generateCombo();
      }

      updateDisplay();
    }

    punchLeftBtn.addEventListener('click', () => handlePunch('L'));
    punchRightBtn.addEventListener('click', () => handlePunch('R'));
    punchUpperBtn.addEventListener('click', () => handlePunch('U'));
    punchLowerBtn.addEventListener('click', () => handlePunch('D'));

    document.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      const key = e.key.toUpperCase();
      if (key === 'L') handlePunch('L');
      else if (key === 'R') handlePunch('R');
      else if (key === 'U') handlePunch('U');
      else if (key === 'D') handlePunch('D');
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
