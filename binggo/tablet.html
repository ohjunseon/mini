<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교회 빙고 - 사회자</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: sans-serif;
}

.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  height: 100vh;
}

/* LEFT */
.left {
  padding: 20px;
  border-right: 2px solid #333;
}
.left h2 {
  text-align: center;
}
.number-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-top: 20px;
}
.num-btn {
  padding: 28px;
  font-size: 32px;
  background: #333;
  border: none;
  color: #fff;
  border-radius: 8px;
}
.num-btn.used {
  background: #0a84ff;
}
.num-btn:disabled {
  opacity: 0.4;
}

/* RIGHT */
.right {
  padding: 20px;
}
.right h2 {
  text-align: center;
}
.line-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 20px;
}
.line-btn {
  padding: 18px;
  font-size: 20px;
  background: #444;
  border: none;
  color: #fff;
  border-radius: 8px;
}
.line-btn.active {
  background: gold;
  color: #000;
}

.reset-btn {
  margin-top: 30px;
  width: 100%;
  padding: 18px;
  font-size: 20px;
  background: crimson;
  border: none;
  color: #fff;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <h2>번호 선택</h2>
    <div class="number-grid" id="numberGrid"></div>
  </div>

  <div class="right">
    <h2>빙고 줄 선택</h2>
    <div class="line-buttons" id="lineButtons"></div>
    <button class="reset-btn" onclick="resetGame()">전체 초기화</button>
  </div>

</div>

<script>
const SUPABASE_URL = "https://basbihjazmyziqbgablt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhc2JpaGphem15emlxYmdhYmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMDQ2NjUsImV4cCI6MjA4MjY4MDY2NX0.VxFrmwM_LMjx6pY5bPnfFxwB4y5_MHCIik9yp7_IZQc";

const ROW_ID = 1;

const headers = {
  "Content-Type": "application/json",
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`
};

const LINES = [
  ["row-0","가로 1"], ["row-1","가로 2"], ["row-2","가로 3"],
  ["row-3","가로 4"], ["row-4","가로 5"],
  ["col-0","세로 1"], ["col-1","세로 2"], ["col-2","세로 3"],
  ["col-3","세로 4"], ["col-4","세로 5"],
  ["diag-main","대각 ↘"], ["diag-sub","대각 ↙"]
];

async function pick(num, state) {
  if (state.used_numbers.includes(num)) return;

  await fetch(`${SUPABASE_URL}/rest/v1/bingo_state?id=eq.${ROW_ID}`, {
    method: "PATCH",
    headers,
    body: JSON.stringify({
      used_numbers: [...state.used_numbers, num],
      current_number: num
    })
  });
}

async function selectLine(line) {
  await fetch(`${SUPABASE_URL}/rest/v1/bingo_state?id=eq.${ROW_ID}`, {
    method: "PATCH",
    headers,
    body: JSON.stringify({ selected_line: line })
  });
}

async function resetGame() {
  if (!confirm("빙고 게임을 초기화하시겠습니까?")) return;

  await fetch(`${SUPABASE_URL}/rest/v1/bingo_state?id=eq.${ROW_ID}`, {
    method: "PATCH",
    headers,
    body: JSON.stringify({
      used_numbers: [],
      current_number: null,
      selected_line: null
    })
  });
}

function render(state) {
  const grid = document.getElementById("numberGrid");
  grid.innerHTML = "";

  for (let i = 1; i <= 25; i++) {
    const btn = document.createElement("button");
    btn.className = "num-btn";
    btn.textContent = i;

    if (state.used_numbers.includes(i)) {
      btn.classList.add("used");
      btn.disabled = true;
    }

    btn.onclick = () => pick(i, state);
    grid.appendChild(btn);
  }

  const lineBox = document.getElementById("lineButtons");
  lineBox.innerHTML = "";

  LINES.forEach(([key, label]) => {
    const btn = document.createElement("button");
    btn.className = "line-btn";
    btn.textContent = label;

    if (state.selected_line === key) btn.classList.add("active");

    btn.onclick = () => selectLine(key);
    lineBox.appendChild(btn);
  });
}

async function poll() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/bingo_state?id=eq.${ROW_ID}`,
    { headers }
  );
  const data = await res.json();
  if (data[0]) render(data[0]);
}

setInterval(poll, 1000);
</script>

</body>
</html>
